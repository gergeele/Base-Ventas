<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rotación · Gráfica Límite</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<style>
/* ===================== Tokens (paleta Gráfica Límite) =====================
   Marca: naranja #FF740E · teal oscuro #004E55 · teal medio #2E7980 · verde éxito #43B754 · fondo #F8F8F8
   Series de gráficos: paleta categórica validada (CVD / contraste) en claro y oscuro, abre con teal y naranja. */
:root {
  color-scheme: light;
  --page: #F8F8F8; --surface: #ffffff; --surface-2: #f1f4f4;
  --ink: #0f1a1b; --ink-2: #4a5859; --muted: #7b8788;
  --grid: #e2e8e8; --axis: #c2cccd; --border: rgba(0,78,85,0.13);
  --accent: #2E7980; --accent-ink: #ffffff; --accent-wash: rgba(46,121,128,0.10);
  --cta: #E8650A; --cta-ink: #ffffff; --orange: #FF740E;
  --header-bg: #004E55; --header-ink: #ffffff; --header-ink-2: rgba(255,255,255,0.74);
  --gap-band: rgba(208,59,59,0.10);
  --good: #2b8a3e; --good-fill: #43B754; --warn: #a35a00; --bad: #c0392b; --info: #2E7980;
  --input-fill: #fff3d6;
  --s1:#008f9a; --s2:#FF740E; --s3:#4a3aa7; --s4:#eda100; --s5:#e87ba4; --s6:#2a78d6; --s7:#e34948; --s8:#008300; --s-otros:#8a9493;
  --radius: 10px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0b1112; --surface: #141b1c; --surface-2: #1c2526;
    --ink: #ffffff; --ink-2: #c3cbca; --muted: #8a9493;
    --grid: #263031; --axis: #344041; --border: rgba(255,255,255,0.10);
    --accent: #4fb0b8; --accent-ink: #0b1112; --accent-wash: rgba(79,176,184,0.16);
    --cta: #ff7f24; --cta-ink: #1a0e05;
    --header-bg: #00363b;
    --gap-band: rgba(230,103,103,0.14);
    --good: #43B754; --good-fill: #43B754; --warn: #fab219; --bad: #e66767; --info: #4fb0b8;
    --input-fill: #3d3414;
    --s1:#0f9aa4; --s2:#e8661a; --s3:#9085e9; --s4:#c98500; --s5:#d55181; --s6:#3987e5; --s7:#e66767; --s8:#008300;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0b1112; --surface: #141b1c; --surface-2: #1c2526;
  --ink: #ffffff; --ink-2: #c3cbca; --muted: #8a9493;
  --grid: #263031; --axis: #344041; --border: rgba(255,255,255,0.10);
  --accent: #4fb0b8; --accent-ink: #0b1112; --accent-wash: rgba(79,176,184,0.16);
  --cta: #ff7f24; --cta-ink: #1a0e05;
  --header-bg: #00363b;
  --gap-band: rgba(230,103,103,0.14);
  --good: #43B754; --good-fill: #43B754; --warn: #fab219; --bad: #e66767; --info: #4fb0b8;
  --input-fill: #3d3414;
  --s1:#0f9aa4; --s2:#e8661a; --s3:#9085e9; --s4:#c98500; --s5:#d55181; --s6:#3987e5; --s7:#e66767; --s8:#008300;
}

/* ===================== Base ===================== */
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
.hidden { display: none !important; }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
a { color: var(--accent); }

/* ===================== Login ===================== */
#login { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
.login-card { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 28px; }
.login-card { border-top: 4px solid var(--orange); }
.login-card h1 { font-size: 20px; margin: 0 0 4px; color: var(--accent); }
.login-card p { margin: 0 0 20px; color: var(--ink-2); }
.field { display: grid; gap: 4px; margin-bottom: 12px; }
.field label { font-size: 12px; color: var(--ink-2); font-weight: 600; }
.field input { width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--axis); background: var(--surface); }
.field input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--axis); background: var(--surface); cursor: pointer; font-weight: 600; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--cta); color: var(--cta-ink); border-color: var(--cta); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
.err { color: var(--bad); font-size: 13px; min-height: 18px; margin-top: 8px; }

/* ===================== App shell ===================== */
header.top { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--border); }
.top-band { background: var(--header-bg); color: var(--header-ink); border-bottom: 3px solid var(--orange); }
.top-row { max-width: 1280px; margin: 0 auto; padding: 8px 16px; display: flex; align-items: center; gap: 16px; }
.brand { white-space: nowrap; line-height: 1.2; }
.brand b { font-size: 15px; display: block; }
.brand small { font-size: 11px; color: var(--header-ink-2); }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; }
nav.tabs button { border: 0; background: transparent; padding: 8px 12px; border-radius: 8px; cursor: pointer; color: var(--header-ink-2); font-weight: 600; white-space: nowrap; }
nav.tabs button:hover { background: rgba(255,255,255,0.10); color: var(--header-ink); }
nav.tabs button[aria-selected="true"] { background: rgba(255,255,255,0.16); color: var(--header-ink); box-shadow: inset 0 -2px 0 var(--orange); }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--header-ink-2); white-space: nowrap; }
.btn.hdr { background: transparent; color: var(--header-ink); border-color: rgba(255,255,255,0.35); }
.btn.hdr:hover { background: rgba(255,255,255,0.12); }
@media (max-width: 1400px) { .top-row { flex-wrap: wrap; row-gap: 4px; } nav.tabs { order: 3; width: 100%; } }

.filters { max-width: 1280px; margin: 0 auto; padding: 8px 16px 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.fgroup { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.flabel { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
.seg { display: inline-flex; border: 1px solid var(--axis); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 10px; cursor: pointer; font-size: 13px; color: var(--ink-2); border-right: 1px solid var(--axis); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.filters input[type="date"], .filters select { padding: 4px 8px; border-radius: 8px; border: 1px solid var(--axis); background: var(--surface); font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chips-row { flex-basis: 100%; order: 99; max-height: 92px; overflow-y: auto; }
.chips-row:empty { display: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px 3px 8px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-2); font-size: 13px; max-width: 360px; }
td.skucol { min-width: 240px; }
thead th.wrap { white-space: normal; min-width: 110px; max-width: 200px; }
.chip .dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.chip .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip button { border: 0; background: transparent; cursor: pointer; color: var(--muted); padding: 0 4px; font-size: 15px; line-height: 1; border-radius: 50%; }
.chip button:hover { color: var(--ink); }
.picker { position: relative; }
.picker input { width: 220px; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--axis); background: var(--surface); font-size: 13px; }
.picker-list { position: absolute; top: calc(100% + 4px); left: 0; width: 520px; max-height: 420px !important; max-width: calc(100vw - 32px); background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.12); z-index: 30; max-height: 320px; overflow: auto; padding: 4px; }
.pick-head { position: sticky; top: -4px; z-index: 1; display: flex; align-items: center; gap: 8px; padding: 6px 8px; margin: -4px -4px 4px; background: var(--surface); border-bottom: 1px solid var(--grid); font-size: 12px; }
.pick-head > span { flex: 1; }
.picker-list button.pick-opt { grid-template-columns: 18px 1fr auto; }
.picker-list button.pick-opt.on { background: var(--accent-wash); }
.picker-list button.pick-opt input { margin: 2px 0 0; width: 15px; height: 15px; accent-color: var(--accent); pointer-events: none; }
.picker-list button.pick-opt { display: grid; gap: 8px; width: 100%; text-align: left; border: 0; background: transparent; padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 13px; align-items: start; }
.picker-list button.pick-opt:hover, .picker-list button.pick-opt.act { background: var(--surface-2); }
.picker-list button.pick-opt.on.act, .picker-list button.pick-opt.on:hover { background: var(--accent-wash); }
.picker-list button.pick-dummy { display: grid; grid-template-columns: 1fr auto; gap: 8px; width: 100%; text-align: left; border: 0; background: transparent; padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.picker-list button:hover, .picker-list button.act { background: var(--surface-2); }
.picker-list .sku { font-weight: 700; display: block; }
.picker-list .pk { min-width: 0; display: grid; }
.picker-list .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }

main { max-width: 1280px; margin: 0 auto; padding: 16px; transition: opacity .15s; }
main.loading { opacity: .5; pointer-events: none; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
.card h2 { font-size: 15px; margin: 0 0 2px; }
.card .sub { font-size: 12px; color: var(--muted); margin: 0 0 12px; }
.card-head { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.card-head > div:first-child { flex: 1; min-width: 200px; }
.card-head h2 { margin: 0 0 2px; }
.card-head .sub { margin: 0; }

/* Tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; text-align: left; }
button.tile { cursor: pointer; }
button.tile:hover { border-color: var(--axis); }
button.tile[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: -1px; }
.tile .k { font-size: 12px; color: var(--ink-2); font-weight: 600; display: flex; gap: 6px; align-items: center; }
.tile .v { font-size: 26px; font-weight: 650; margin-top: 2px; line-height: 1.15; }
.tile .d { font-size: 12px; color: var(--muted); margin-top: 2px; }

/* Status tags (icono + texto, nunca solo color) */
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.tag.bad { color: var(--bad); } .tag.warn { color: var(--warn); } .tag.good { color: var(--good); } .tag.neutral { color: var(--muted); }
.tag svg { width: 12px; height: 12px; }

/* Tables */
.tbl-wrap { overflow: auto; max-height: 70vh; border: 1px solid var(--border); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 10px; border-bottom: 1px solid var(--grid); }
td:first-child { white-space: nowrap; }
thead th { position: sticky; top: 0; background: var(--surface-2); font-size: 12px; color: var(--ink-2); text-align: left; font-weight: 650; z-index: 1; white-space: nowrap; }
thead th.num { text-align: right; }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--ink); }
tbody tr:hover { background: var(--surface-2); }
tfoot td { font-weight: 700; border-top: 1px solid var(--axis); background: var(--surface-2); position: sticky; bottom: 0; }
td.nm { max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
tr.gap td { background: var(--gap-band); }
tr.sel td { background: var(--accent-wash); }
td input[type="checkbox"], th input[type="checkbox"] { width: 15px; height: 15px; cursor: pointer; accent-color: var(--accent); }

/* Resumen */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 0; }
.kv > div { padding: 6px 0; border-bottom: 1px solid var(--grid); }
.kv > .k { color: var(--ink-2); padding-right: 12px; }
.kv > .v { text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
.kv .ind { padding-left: 14px; font-weight: 500 !important; }
.kv input { width: 100px; text-align: right; padding: 4px 8px; border: 1px solid var(--axis); border-radius: 6px; background: var(--input-fill); font-weight: 650; }
.kv .hint { grid-column: 1 / -1; font-size: 12px; color: var(--muted); border-bottom: 0; padding: 0 0 6px; text-align: left !important; font-weight: 400 !important; }
.verdict { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); display: flex; gap: 8px; align-items: center; font-weight: 650; }
ul.insights { margin: 0; padding: 0; list-style: none; }
ul.insights li { display: grid; grid-template-columns: 18px 1fr; align-items: baseline; }
ul.insights li { margin-bottom: 8px; }
ul.defs { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 13px; }

/* Chart */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); margin-bottom: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
#tt { position: fixed; z-index: 50; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.15); padding: 8px 10px; font-size: 12px; min-width: 150px; }
#tt .h { color: var(--ink-2); font-weight: 600; margin-bottom: 4px; }
#tt .r { display: grid; grid-template-columns: 12px auto 1fr; gap: 6px; align-items: center; }
#tt .r i { height: 2px; border-radius: 1px; }
#tt .r b { font-variant-numeric: tabular-nums; }
#tt .r span { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
#tt .tot { border-top: 1px solid var(--grid); margin-top: 4px; padding-top: 4px; }

.drop { border: 2px dashed var(--axis); border-radius: 10px; padding: 26px 16px; display: grid; gap: 4px; justify-items: center; text-align: center; cursor: pointer; background: var(--surface-2); }
.drop:hover, .drop.over, .drop:focus-visible { border-color: var(--accent); background: var(--accent-wash); outline: none; }
ul.upl { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 6px; font-size: 13px; }
ul.upl li { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.q { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--axis); background: var(--surface); color: var(--ink-2); font-size: 10px; font-weight: 700; line-height: 1; padding: 0; margin-left: 5px; cursor: pointer; vertical-align: middle; flex: none; }
.q:hover, .q[aria-expanded="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
thead th .q { margin-left: 4px; }
#pop { position: fixed; z-index: 70; max-width: 300px; background: var(--surface); color: var(--ink); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.16); padding: 10px 12px; font-size: 12.5px; line-height: 1.45; font-weight: 400; text-transform: none; letter-spacing: 0; }
dialog.modal { border: 0; border-radius: 12px; padding: 0; width: calc(100% - 32px); max-width: 720px; background: var(--surface); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.3); }
dialog.modal::backdrop { background: rgba(0,0,0,.45); }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; background: var(--header-bg); color: var(--header-ink); border-bottom: 3px solid var(--orange); }
.modal-head h2 { margin: 0; font-size: 16px; }
.modal-head .btn { color: var(--header-ink); }
.modal-body { padding: 16px 18px; max-height: 70vh; overflow: auto; }
.modal-body h3 { font-size: 14px; margin: 16px 0 6px; color: var(--accent); }
.modal-body section:first-of-type h3 { margin-top: 4px; }
.modal-body p { margin: 0 0 6px; }
.modal-foot { padding: 10px 18px; border-top: 1px solid var(--grid); display: flex; justify-content: flex-end; }
.tkform { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
.tkform .field { display: grid; gap: 4px; margin: 0; }
.tkform .field > span { font-size: 12px; color: var(--ink-2); font-weight: 600; }
.tkform .full { grid-column: 1 / -1; }
.tkform label.chk { display: flex; gap: 8px; align-items: center; }
.tkform label.chk input { width: auto; flex: none; }
.tkform .chk > span { font-weight: 400; }
.tkform input[type=text], .tkform select, .tkform textarea, .modal-body textarea { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--axis); background: var(--surface); font: inherit; color: inherit; }
@media (max-width: 720px) { .tkform { grid-template-columns: 1fr; } }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.thumb { position: relative; width: 96px; height: 72px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); display: block; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb button { position: absolute; top: 2px; right: 2px; border: 0; border-radius: 50%; width: 20px; height: 20px; background: rgba(0,0,0,.6); color: #fff; cursor: pointer; line-height: 1; }
ul.hist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 13px; }
ul.hist li { border-left: 3px solid var(--accent); padding: 2px 0 2px 10px; }
.pre { white-space: pre-wrap; background: var(--surface-2); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
.okmsg { color: var(--good); font-weight: 600; }
tr.clic { cursor: pointer; }
.gestion { border-top: 1px solid var(--grid); margin-top: 14px; }
.empty { text-align: center; padding: 48px 16px; color: var(--ink-2); }
.empty h3 { color: var(--ink); margin: 0 0 6px; }
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.toolbar input[type="search"] { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--axis); background: var(--surface); width: 260px; max-width: 100%; }
.banner { padding: 10px 12px; border-radius: 8px; background: var(--surface-2); color: var(--ink-2); font-size: 13px; margin-bottom: 12px; }

@media (max-width: 720px) {
  header.top { position: static; }
  .top-row { flex-wrap: wrap; gap: 8px; }
  .top-right { margin-left: 0; width: 100%; justify-content: space-between; }
  nav.tabs { order: 3; width: 100%; }
  #btnAyuda .lbl { display: none; }
  .picker input { width: 100%; }
  .tile .v { font-size: 22px; }
}
@media print { header.top { position: static; } .btn, .picker { display: none !important; } }
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<section id="login" class="hidden">
  <form class="login-card" id="loginForm" autocomplete="on">
    <h1>Rotación de ventas</h1>
    <p>Gráfica Límite · ingresá con tu usuario</p>
    <div class="field"><label for="lEmail">Email</label><input id="lEmail" type="email" autocomplete="username" required></div>
    <div class="field"><label for="lPass">Contraseña</label><input id="lPass" type="password" autocomplete="current-password" required></div>
    <button class="btn primary" type="submit" style="width:100%;justify-content:center;margin-top:4px" id="lBtn">Ingresar</button>
    <div class="err" id="lErr"></div>
  </form>
</section>

<!-- ===================== APP ===================== -->
<section id="app" class="hidden">
  <header class="top">
    <div class="top-band"><div class="top-row">
      <div class="brand"><b>📈 Rotación de ventas — Gráfica Límite</b><small><span id="versionTxt">versión —</span> · <span id="freshness"></span></small></div>
      <nav class="tabs" role="tablist" id="tabs">

/** Llama una RPC paginando de a 1000 filas; reintenta cortes de red y renueva la sesión si venció. */
async function rpcTodo(fn, args) {
  const out = [];
  for (let from = 0; ; from += 1000) {
    let data, error;
    for (let intento = 0; intento < 3; intento++) {
      ({ data, error } = await sb.rpc(fn, args).range(from, from + 999));
      if (!error) break;
      if (esSesionVencida(error) && intento === 0) { const r = await sb.auth.refreshSession(); if (r.error) { mostrarLogin(); throw new Error("La sesión venció: volvé a ingresar."); } continue; }
      if (!esErrorRed(error)) break;
      await new Promise((r) => setTimeout(r, 800 * (intento + 1)));
    }
    if (error) { registrarError("rpc " + fn, error); throw error; }
    out.push(...data);
    if (data.length < 1000) break;
  }
  return out;
}

  state.catalogo = cat;

  state.pres = pres;
  state.presMap = new Map(pres.map((p) => [p.sku_codigo, p]));

  for (const l of state.presPorBase.values()) l.sort((a, b) => b.unid_90 - a.unid_90 || a.sku_codigo.localeCompare(b.sku_codigo));
  const e = est.data && est.data[0];

/* ===================== Cálculo (misma lógica que el Excel) ===================== */
function calcular() {
  const skus = selEf();
  const filas = filasSeleccion();

  const ayer = iso(dn(hoyAR()) - 1);
  let fin = state.periodo === "custom" && state.hasta ? state.hasta : ayer;
  const conVenta = filas.filter((f) => f.uv > 0);
  const primeraVentaTotal = conVenta.length ? conVenta.reduce((m, f) => (f.fecha < m ? f.fecha : m), "9999") : null;
  let desde;
  const nFin = dn(fin);
  if (state.periodo === "90d") desde = iso(nFin - 89);
  else if (state.periodo === "6m") desde = iso(nFin - 182);
  else if (state.periodo === "12m") desde = iso(nFin - 364);
  else if (state.periodo === "custom" && state.desde) desde = state.desde;
  else desde = primeraVentaTotal || fin;
  // el calendario arranca con la primera venta (no antes) para no contar "huecos" previos al lanzamiento
  if (primeraVentaTotal && primeraVentaTotal > desde) desde = primeraVentaTotal;
  if (desde > fin) desde = fin;

  const n0 = dn(desde), n1 = dn(fin), nd = n1 - n0 + 1;
  // índice diario sobre TODA la historia (para velocidades) y luego se recorta al período
  const porDia = new Map();
  for (const f of filas) {
    let d = porDia.get(f.fecha);
    if (!d) { d = { uv: 0, unv: 0, ing: 0, ingML: 0, car: 0, ven: 0, uvFull: 0, venMay: 0, uvMay: 0, porSku: {} }; porDia.set(f.fecha, d); }
    if (f.lg === "full") d.uvFull += f.uv;
    if (f.may) { d.venMay += f.ven; d.uvMay += f.uv; }
    d.uv += f.uv; d.unv += f.unv; d.ing += f.ing; d.car += f.car; d.ven += f.ven;
    if (f.canal === "mercadolibre") d.ingML += f.ing;
    d.porSku[f.sku] = (d.porSku[f.sku] || 0) + f.uv;
  }

  const dias = [];
  let racha = 0;
  for (let i = 0; i < nd; i++) {
    const fecha = iso(n0 + i);
    const d = porDia.get(fecha) || { uv: 0, unv: 0, ing: 0, ingML: 0, car: 0, ven: 0, uvFull: 0, venMay: 0, uvMay: 0, porSku: {} };
    racha = d.uv > 0 ? 0 : racha + 1;
    dias.push({ fecha, mes: fecha.slice(0, 7), ...d, neto: d.ing - d.car, racha });
  }
  // marcar rachas >= 3 completas (todos los días de la racha, no solo desde el 3°)
  const huecos = [];
  for (let i = 0; i < dias.length; ) {
    if (dias[i].uv === 0) {
      let j = i; while (j < dias.length && dias[j].uv === 0) j++;
      if (j - i >= UMBRALES.rachaDias) { huecos.push({ desde: dias[i].fecha, hasta: dias[j - 1].fecha, n: j - i, i0: i, i1: j - 1 }); for (let k = i; k < j; k++) dias[k].hueco = true; }
      i = j;
    } else i++;
  }

  // meses
  const mesesMap = new Map();
  for (const d of dias) {
    let m = mesesMap.get(d.mes);
    if (!m) { m = { mes: d.mes, uv: 0, unv: 0, ven: 0, ing: 0, ingML: 0, car: 0, uvFull: 0, venMay: 0, uvMay: 0, diasVenta: 0, diasPer: 0, porSku: {} }; mesesMap.set(d.mes, m); }
    m.uvFull += d.uvFull; m.venMay += d.venMay; m.uvMay += d.uvMay; m.ven += d.ven; m.uv += d.uv; m.unv += d.unv; m.ing += d.ing; m.ingML += d.ingML; m.car += d.car; m.diasPer++; if (d.uv > 0) m.diasVenta++;
    for (const [k, v] of Object.entries(d.porSku)) m.porSku[k] = (m.porSku[k] || 0) + v;
  }
  const meses = [...mesesMap.values()];

  // velocidades relativas al corte (usan historia completa, no solo el período)
  const sumaVentana = (n) => { let t = 0; for (const [f, d] of porDia) { const x = dn(f); if (x > n1 - n && x <= n1) t += d.uv; } return t; };
  const v30 = sumaVentana(30) / 30, v60 = sumaVentana(60) / 60, v90 = sumaVentana(90) / 90;
  let sinVenta90 = 0; for (let x = n1 - 89; x <= n1; x++) { const d = porDia.get(iso(x)); if (!d || d.uv === 0) sinVenta90++; }
  // si el SKU es más nuevo que 90 días, no contar días previos al lanzamiento
  if (primeraVentaTotal && dn(primeraVentaTotal) > n1 - 89) sinVenta90 -= dn(primeraVentaTotal) - (n1 - 89);

  const porSku = skus.map((k) => {
    const fs = filas.filter((f) => f.sku === k);
    const enPer = fs.filter((f) => f.fecha >= desde && f.fecha <= fin);
    const ventas = fs.filter((f) => f.uv > 0 && f.fecha <= fin);
    let u30 = 0; for (const f of fs) { const x = dn(f.fecha); if (x > n1 - 30 && x <= n1) u30 += f.uv; }
    return {
      sku: k, nombre: nombreSku(k),
      uv: enPer.reduce((a, f) => a + f.uv, 0), unv: enPer.reduce((a, f) => a + f.unv, 0), ing: enPer.reduce((a, f) => a + f.ing, 0),
      v30: u30 / 30,
      primera: ventas.length ? ventas.reduce((m, f) => (f.fecha < m ? f.fecha : m), "9999") : null,
      ultima: ventas.length ? ventas.reduce((m, f) => (f.fecha > m ? f.fecha : m), "0000") : null,
    };
  });

  // desglose por presentación (dentro del período)
  const pm = new Map();
  for (const f of filas) {
    if (f.fecha < desde || f.fecha > fin) continue;
    let x = pm.get(f.cod);
    if (!x) { x = { cod: f.cod, base: f.base, uv: 0, upub: 0, unv: 0, ing: 0, ultima: null, canales: new Set() }; pm.set(f.cod, x); }
    x.uv += f.uv; x.upub += f.upub; x.unv += f.unv; x.ing += f.ing; x.canales.add(f.canal);
    if (f.uv > 0 && (!x.ultima || f.fecha > x.ultima)) x.ultima = f.fecha;
  }
  const porPres = [...pm.values()].sort((a, b) => a.base.localeCompare(b.base, "es", { numeric: true }) || b.uv - a.uv);
  const tot = dias.reduce((a, d) => ({ uv: a.uv + d.uv, unv: a.unv + d.unv, ven: a.ven + d.ven, ing: a.ing + d.ing, ingML: a.ingML + d.ingML, car: a.car + d.car, uvFull: a.uvFull + d.uvFull, venMay: a.venMay + d.venMay, uvMay: a.uvMay + d.uvMay }), { uv: 0, unv: 0, ven: 0, ing: 0, ingML: 0, car: 0, uvFull: 0, venMay: 0, uvMay: 0 });
  const ultimaVenta = porSku.reduce((m, p) => (p.ultima && p.ultima > m ? p.ultima : m), "");
  return { desde, fin, dias, meses, huecos, tot, porPres, v30, v60, v90, sinVenta90, rachaMax: dias.reduce((m, d) => Math.max(m, d.racha), 0), porSku, ultimaVenta, hayDatos: filas.length > 0 };
}

  }

function insights(r) {
  const out = [];
  const pct = r.v90 > 0 ? r.v30 / r.v90 - 1 : null;
  if (pct !== null) {
    if (pct >= 0.15) out.push(["up", "good", `Acelerando: vende ${nf2.format(r.v30)} u/día en los últimos 30 días, ${fPs(pct)} vs. el promedio de 90 días.`]);

    else out.push(["ok", "neutral", `Ritmo estable: ${nf2.format(r.v30)} u/día (≈ ${nf0.format(r.v30 * 30)} u/mes).`]);
  }
  if (r.ultimaVenta) {
    const sin = dn(r.fin) - dn(r.ultimaVenta);
    if (sin >= 7) out.push(["stop", "bad", `Última venta el ${fD(r.ultimaVenta)}: ${sin} días sin vender al corte. ¿Hay stock y la publicación está activa?`]);
  }
  if (r.huecos.length) {
    const top = [...r.huecos].sort((a, b) => b.n - a.n).slice(0, 3).map((g) => `${fD(g.desde)}–${fD(g.hasta)} (${g.n} d)`).join(", ");
    out.push(["stop", "bad", `${r.huecos.length} corte${r.huecos.length > 1 ? "s" : ""} de 3+ días sin venta en el período. Los más largos: ${top}. Probables quiebres de stock o pausas: confirmar con Stock.`]);
  }
  // reemplazo entre SKUs (uno deja de vender y otro arranca)
  const ps = r.porSku.filter((p) => p.primera && p.ultima);
  for (const a of ps) for (const b of ps) {
    if (a === b) continue;
    const delta = dn(b.primera) - dn(a.ultima);
    if (delta >= -15 && delta <= 20 && dn(r.fin) - dn(a.ultima) > 20 && b.primera > a.primera)
      out.push(["ok", "neutral", `${etiquetaSku(b.sku)} reemplazó a ${etiquetaSku(a.sku)}: ${etiquetaSku(a.sku)} vendió hasta el ${fD(a.ultima)} y ${etiquetaSku(b.sku)} arrancó el ${fD(b.primera)}. Conviene leerlos juntos.`]);
  }
  const completos = r.meses.filter((m) => m.diasPer >= 28);
  if (completos.length >= 3) {
    const best = completos.reduce((a, b) => (b.uv > a.uv ? b : a)), worst = completos.reduce((a, b) => (b.uv < a.uv ? b : a));
    out.push(["ok", "neutral", `Mejor mes: ${fMes(best.mes)} (${nf0.format(best.uv)} u). Peor mes completo: ${fMes(worst.mes)} (${nf0.format(worst.uv)} u).`]);
  }
  if (r.tot.venMay) out.push(["up", "good", `${nf0.format(r.tot.venMay)} venta${r.tot.venMay > 1 ? "s" : ""} mayorista${r.tot.venMay > 1 ? "s" : ""} (precio por cantidad) en el período: ${nf0.format(r.tot.uvMay)} unidad${r.tot.uvMay === 1 ? "" : "es"}.`]);
  if (r.tot.uv && r.tot.uvFull / r.tot.uv >= 0.5) out.push(["ok", "neutral", `${fP(r.tot.uvFull / r.tot.uv)} de las unidades salieron por Full: la reposición del depósito de ML (Full) es clave.`]);
  const canc = r.tot.uv + r.tot.unv > 0 ? r.tot.unv / (r.tot.uv + r.tot.unv) : 0;

  return out;
}

async function subirArchivos(files) {
  const validos = files.filter((f) => /\.(csv|xlsx)$/i.test(f.name));
  for (const f of files) if (!validos.includes(f)) datosUI.log.unshift({ nombre: f.name, estado: "error", msg: "Formato no soportado: tiene que ser .csv o .xlsx" });
  render();
  for (const f of validos) {
    const item = { nombre: f.name, estado: "en_curso", msg: "Subiendo…" };
    datosUI.log.unshift(item); render();
    const ahora = new Intl.DateTimeFormat("sv-SE", { timeZone: TZ, dateStyle: "short", timeStyle: "medium" }).format(new Date()).replace(" ", "_").replace(/:/g, "");
    const limpio = f.name.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^A-Za-z0-9._-]+/g, "_");
    const path = `tienda/${ahora}_${limpio}`;
    const tipo = /\.csv$/i.test(f.name) ? "text/csv" : "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
    const up = await sb.storage.from(BUCKET).upload(path, f, { contentType: tipo, upsert: false });
    if (up.error) { Object.assign(item, { estado: "error", msg: "No se pudo subir: " + up.error.message }); render(); continue; }
    item.msg = "Procesando… (puede tardar hasta un minuto)"; render();
    const { data, error } = await sb.functions.invoke("ml-historico-import/procesar", { body: { path } });
    if (error) {
      let msg = error.message;
      try { msg = (await error.context.json()).error || msg; } catch {}
      Object.assign(item, { estado: "pendiente", msg: "Subido. No se pudo procesar ahora (" + msg + "): se procesa solo en los próximos 10 minutos." });
    } else {
      const a = data && data.archivo;
      if (a && a.estado === "ok") Object.assign(item, { estado: "ok", msg: `Listo: ${nf0.format(a.filas_cargadas)} líneas cargadas${a.descartadas ? `, ${nf0.format(a.descartadas)} descartadas` : ""}.` });
      else if (a && a.estado === "error") Object.assign(item, { estado: "error", msg: a.ultimo_error || "Error al procesar" });
      else Object.assign(item, { estado: "pendiente", msg: "Subido y en cola: se termina de procesar en los próximos minutos." });
    }
    render();
  }
  state.cache.clear();
  try { await cargarCatalogo(); } catch {}
  render();
}

function agregarCapturas(files) {
  for (const f of files) {

    if (f.size > MAX_CAPTURA_MB * 1048576) { tkUI.msg = { err: true, t: `"${f.name || "captura"}" pesa más de ${MAX_CAPTURA_MB} MB.` }; continue; }

async function enviarTicket() {
  const F = tkUI.form;

    if (!user) throw new Error("La sesión venció: volvé a ingresar.");
    const capturas = [];
    for (let i = 0; i < tkUI.capturas.length; i++) {
      const f = tkUI.capturas[i].file;

/* ===================== Buscador de SKUs ===================== */
function initPicker() {
  const inp = $("#pickInput"), list = $("#pickList");
  const MAX_OPC = 60;
  let opts = [], act = 0, total = 0;
  const sinEsp = (x) => x.toLowerCase().replace(/\s+/g, "");
  const elegido = (k) => state.seleccion.includes(k);
  // tildar / destildar sin cerrar la lista ni borrar lo que escribiste
  const alternar = (k) => {
    if (elegido(k)) { state.seleccion.splice(state.seleccion.indexOf(k), 1); state.colorDe.delete(k); }
    else state.seleccion.push(k);
    render(); pintar();
  };
  const alternarTodos = () => {
    const todos = opts.every((o) => elegido(o.key));
    for (const o of opts) {
      if (todos && elegido(o.key)) { state.seleccion.splice(state.seleccion.indexOf(o.key), 1); state.colorDe.delete(o.key); }
      if (!todos && !elegido(o.key)) state.seleccion.push(o.key);
    }
    render(); pintar();
  };
  const pintar = (porTeclado = false) => {
    const scroll = list.scrollTop;
    list.textContent = "";
    if (!opts.length) { list.classList.toggle("hidden", !inp.value.trim()); if (inp.value.trim()) list.append(h("div", { class: "pick-head muted", text: "Sin coincidencias" })); return; }
    const nSel = opts.filter((o) => elegido(o.key)).length;
    const todos = nSel === opts.length;
    list.append(h("div", { class: "pick-head" },
      h("span", { class: "muted", text: `${total > opts.length ? `${opts.length} de ${nf0.format(total)}` : nf0.format(opts.length)} coincidencia${opts.length === 1 ? "" : "s"} · ${nSel} tildada${nSel === 1 ? "" : "s"}` }),
      opts.length > 1 ? h("button", { type: "button", class: "btn sm ghost", onmousedown: (e) => { e.preventDefault(); alternarTodos(); }, text: todos ? "Destildar todas" : "Tildar todas" }) : null,
      h("button", { type: "button", class: "btn sm", onmousedown: (e) => { e.preventDefault(); cerrar(); }, text: "Listo" })));
    opts.forEach((o, i) => {
      const chk = h("input", { type: "checkbox", tabindex: -1, "aria-hidden": "true" }); chk.checked = elegido(o.key);
      const b = h("button", { type: "button", class: "pick-opt" + (i === act ? " act" : "") + (chk.checked ? " on" : ""), role: "option", "aria-selected": String(chk.checked),
        onmousedown: (e) => { e.preventDefault(); act = i; alternar(o.key); } },
        chk, h("span", { class: "pk" }, h("span", { class: "sku", text: o.label }), o.nombre ? h("span", { class: "nm", text: o.nombre }) : null), h("span", { class: "muted", text: o.sub }));
      list.append(b);
    });
    list.classList.remove("hidden");
    list.scrollTop = scroll;
    if (porTeclado) { const a = list.querySelector(".pick-opt.act"); if (a) a.scrollIntoView({ block: "nearest" }); }
  };
  const buscar = () => {
    const q = inp.value.trim().toLowerCase(), qs = sinEsp(q);
    if (!q) { opts = []; total = 0; pintar(); return; }
    const exact = [], pref = [], cont = [];
    const op = (c) => ({ key: c.sku_base, label: c.sku_base, nombre: c.titulo || "", u: c.unid_90, sub: fN(c.unid_30) + " u/30d" });
    for (const c of state.catalogo) {
      const k = c.sku_base.toLowerCase();
      if (k === q || sinEsp(k) === qs) exact.push(op(c));
      else if (k.startsWith(q) || sinEsp(k).startsWith(qs)) pref.push(op(c));
      else if (k.includes(q) || sinEsp(k).includes(qs) || (c.titulo || "").toLowerCase().includes(q)) cont.push(op(c));
    }
    const byU = (a, b) => b.u - a.u;
    const todas = [...exact, ...pref.sort(byU), ...cont.sort(byU)];
    total = todas.length; opts = todas.slice(0, MAX_OPC); act = 0; list.scrollTop = 0; pintar();
  };
  const cerrar = () => { list.classList.add("hidden"); inp.value = ""; opts = []; inp.blur(); };
  inp.addEventListener("input", buscar);
  inp.addEventListener("focus", buscar);
  inp.addEventListener("blur", () => setTimeout(() => list.classList.add("hidden"), 150));
  inp.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { act = Math.min(opts.length - 1, act + 1); pintar(true); e.preventDefault(); }
    else if (e.key === "ArrowUp") { act = Math.max(0, act - 1); pintar(true); e.preventDefault(); }
    else if (e.key === "Enter" && opts[act]) { alternar(opts[act].key); e.preventDefault(); }
    else if (e.key === "Escape") { cerrar(); }
  });
}

$("#tabs").addEventListener("click", (e) => { const b = e.target.closest("button[data-tab]"); if (b) irA(b.dataset.tab); });
$("#segPeriodo").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-p]"); if (!b) return;
  state.periodo = b.dataset.p;
  if (state.periodo === "custom") { const r = ultimo || {}; if (!state.desde) state.desde = r.desde || iso(dn(hoyAR()) - 90); if (!state.hasta) state.hasta = r.fin || iso(dn(hoyAR()) - 1); $("#fDesde").value = state.desde; $("#fHasta").value = state.hasta; }
  render();
});
$("#fDesde").addEventListener("change", (e) => { state.desde = e.target.value || null; render(); });
$("#fHasta").addEventListener("change", (e) => { state.hasta = e.target.value || null; render(); });
$("#fCanal").addEventListener("change", (e) => { state.canal = e.target.value; render(); });
$("#fEnvio").addEventListener("change", (e) => { state.envio = e.target.value; render(); });
$("#fMayorista").addEventListener("change", (e) => { state.mayorista = e.target.value; render(); });
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (state.tab === "mensual" || state.tab === "diario") render(); }, 200); });

initPicker();
leerHash();
if (state.periodo === "custom") { $("#fDesde").value = state.desde || ""; $("#fHasta").value = state.hasta || ""; }
sb.auth.getSession().then(({ data }) => (data.session ? entrar() : mostrarLogin()));
sb.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_OUT") mostrarLogin(); });
</script>
</body>
</html>
