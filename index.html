<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rotación · Gráfica Límite</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<style>
/* ===================== Tokens (paleta Gráfica Límite) =====================
   Marca: naranja #FF740E · teal oscuro #004E55 · teal medio #2E7980 · verde éxito #43B754 · fondo #F8F8F8
   Series de gráficos: paleta categórica validada (CVD / contraste) en claro y oscuro, abre con teal y naranja. */
:root {
  color-scheme: light;
  --page: #F8F8F8; --surface: #ffffff; --surface-2: #f1f4f4;
  --ink: #0f1a1b; --ink-2: #4a5859; --muted: #7b8788;
  --grid: #e2e8e8; --axis: #c2cccd; --border: rgba(0,78,85,0.13);
  --accent: #2E7980; --accent-ink: #ffffff; --accent-wash: rgba(46,121,128,0.10);
  --cta: #E8650A; --cta-ink: #ffffff; --orange: #FF740E;
  --header-bg: #004E55; --header-ink: #ffffff; --header-ink-2: rgba(255,255,255,0.74);
  --gap-band: rgba(208,59,59,0.10);
  --good: #2b8a3e; --good-fill: #43B754; --warn: #a35a00; --bad: #c0392b; --info: #2E7980;
  --input-fill: #fff3d6;
  --s1:#008f9a; --s2:#FF740E; --s3:#4a3aa7; --s4:#eda100; --s5:#e87ba4; --s6:#2a78d6; --s7:#e34948; --s8:#008300; --s-otros:#8a9493;
  --radius: 10px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0b1112; --surface: #141b1c; --surface-2: #1c2526;
    --ink: #ffffff; --ink-2: #c3cbca; --muted: #8a9493;
    --grid: #263031; --axis: #344041; --border: rgba(255,255,255,0.10);
    --accent: #4fb0b8; --accent-ink: #0b1112; --accent-wash: rgba(79,176,184,0.16);
    --cta: #ff7f24; --cta-ink: #1a0e05;
    --header-bg: #00363b;
    --gap-band: rgba(230,103,103,0.14);
    --good: #43B754; --good-fill: #43B754; --warn: #fab219; --bad: #e66767; --info: #4fb0b8;
    --input-fill: #3d3414;
    --s1:#0f9aa4; --s2:#e8661a; --s3:#9085e9; --s4:#c98500; --s5:#d55181; --s6:#3987e5; --s7:#e66767; --s8:#008300;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0b1112; --surface: #141b1c; --surface-2: #1c2526;
  --ink: #ffffff; --ink-2: #c3cbca; --muted: #8a9493;
  --grid: #263031; --axis: #344041; --border: rgba(255,255,255,0.10);
  --accent: #4fb0b8; --accent-ink: #0b1112; --accent-wash: rgba(79,176,184,0.16);
  --cta: #ff7f24; --cta-ink: #1a0e05;
  --header-bg: #00363b;
  --gap-band: rgba(230,103,103,0.14);
  --good: #43B754; --good-fill: #43B754; --warn: #fab219; --bad: #e66767; --info: #4fb0b8;
  --input-fill: #3d3414;
  --s1:#0f9aa4; --s2:#e8661a; --s3:#9085e9; --s4:#c98500; --s5:#d55181; --s6:#3987e5; --s7:#e66767; --s8:#008300;
}

/* ===================== Base ===================== */
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
.hidden { display: none !important; }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
a { color: var(--accent); }

/* ===================== Login ===================== */
#login { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
.login-card { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 28px; }
.login-card { border-top: 4px solid var(--orange); }
.login-card h1 { font-size: 20px; margin: 0 0 4px; color: var(--accent); }
.login-card p { margin: 0 0 20px; color: var(--ink-2); }
.field { display: grid; gap: 4px; margin-bottom: 12px; }
.field label { font-size: 12px; color: var(--ink-2); font-weight: 600; }
.field input { width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--axis); background: var(--surface); }
.field input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--axis); background: var(--surface); cursor: pointer; font-weight: 600; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--cta); color: var(--cta-ink); border-color: var(--cta); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
.err { color: var(--bad); font-size: 13px; min-height: 18px; margin-top: 8px; }

/* ===================== App shell ===================== */
header.top { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--border); }
.top-band { background: var(--header-bg); color: var(--header-ink); border-bottom: 3px solid var(--orange); }
.top-row { max-width: 1280px; margin: 0 auto; padding: 8px 16px; display: flex; align-items: center; gap: 16px; }
.brand { white-space: nowrap; line-height: 1.2; }
.brand b { font-size: 15px; display: block; }
.brand small { font-size: 11px; color: var(--header-ink-2); }
.refresh-btn { background: none; border: 0; padding: 0 5px; margin: 0 1px; border-radius: 4px; color: var(--header-ink); font: inherit; font-size: 13px; line-height: 1.3; cursor: pointer; vertical-align: baseline; }
.refresh-btn:hover:not(:disabled) { background: rgba(255,255,255,.15); }
.refresh-btn:disabled { opacity: .6; cursor: default; }
.refresh-btn span { display: inline-block; }
.refresh-btn.girando span { animation: girar 1s linear infinite; }
@keyframes girar { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .refresh-btn.girando span { animation: none; } }
#freshness.warn { color: #ffd27a; font-weight: 600; }
#freshHelp .q { vertical-align: baseline; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; }
nav.tabs button { border: 0; background: transparent; padding: 8px 12px; border-radius: 8px; cursor: pointer; color: var(--header-ink-2); font-weight: 600; white-space: nowrap; }
nav.tabs button:hover { background: rgba(255,255,255,0.10); color: var(--header-ink); }
nav.tabs button[aria-selected="true"] { background: rgba(255,255,255,0.16); color: var(--header-ink); box-shadow: inset 0 -2px 0 var(--orange); }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--header-ink-2); white-space: nowrap; }
.btn.hdr { background: transparent; color: var(--header-ink); border-color: rgba(255,255,255,0.35); }
.btn.hdr:hover { background: rgba(255,255,255,0.12); }
@media (max-width: 1400px) { .top-row { flex-wrap: wrap; row-gap: 4px; } nav.tabs { order: 3; width: 100%; } }

.filters { max-width: 1280px; margin: 0 auto; padding: 8px 16px 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.fgroup { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.flabel { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
.seg { display: inline-flex; border: 1px solid var(--axis); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 10px; cursor: pointer; font-size: 13px; color: var(--ink-2); border-right: 1px solid var(--axis); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.filters input[type="date"], .filters select { padding: 4px 8px; border-radius: 8px; border: 1px solid var(--axis); background: var(--surface); font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chips-row { flex-basis: 100%; order: 99; max-height: 92px; overflow-y: auto; }
.chips-row:empty { display: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px 3px 8px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-2); font-size: 13px; max-width: 360px; }
td.skucol { min-width: 240px; }
thead th.wrap { white-space: normal; min-width: 110px; max-width: 200px; }
.chip .dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.chip .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip button { border: 0; background: transparent; cursor: pointer; color: var(--muted); padding: 0 4px; font-size: 15px; line-height: 1; border-radius: 50%; }
.chip button:hover { color: var(--ink); }
.picker { position: relative; }
.picker input { width: 220px; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--axis); background: var(--surface); font-size: 13px; }
.picker-list { position: absolute; top: calc(100% + 4px); left: 0; width: 520px; max-height: 420px !important; max-width: calc(100vw - 32px); background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.12); z-index: 30; max-height: 320px; overflow: auto; padding: 4px; }
.pick-head { position: sticky; top: -4px; z-index: 1; display: flex; align-items: center; gap: 8px; padding: 6px 8px; margin: -4px -4px 4px; background: var(--surface); border-bottom: 1px solid var(--grid); font-size: 12px; }
.pick-head > span { flex: 1; }
.picker-list button.pick-opt { grid-template-columns: 18px 1fr auto; }
.picker-list button.pick-opt.on { background: var(--accent-wash); }
.picker-list button.pick-opt input { margin: 2px 0 0; width: 15px; height: 15px; accent-color: var(--accent); pointer-events: none; }
.picker-list button.pick-opt { display: grid; gap: 8px; width: 100%; text-align: left; border: 0; background: transparent; padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 13px; align-items: start; }
.picker-list button.pick-opt:hover, .picker-list button.pick-opt.act { background: var(--surface-2); }
.picker-list button.pick-opt.on.act, .picker-list button.pick-opt.on:hover { background: var(--accent-wash); }
.picker-list button.pick-dummy { display: grid; grid-template-columns: 1fr auto; gap: 8px; width: 100%; text-align: left; border: 0; background: transparent; padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.picker-list button:hover, .picker-list button.act { background: var(--surface-2); }
.picker-list .sku { font-weight: 700; display: block; }
.picker-list .pk { min-width: 0; display: grid; }
.picker-list .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }

main { max-width: 1280px; margin: 0 auto; padding: 16px; transition: opacity .15s; }
main.loading { opacity: .5; pointer-events: none; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
.card h2 { font-size: 15px; margin: 0 0 2px; }
.card .sub { font-size: 12px; color: var(--muted); margin: 0 0 12px; }
.card-head { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.card-head > div:first-child { flex: 1; min-width: 200px; }
.card-head h2 { margin: 0 0 2px; }
.card-head .sub { margin: 0; }

/* Tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; text-align: left; }
button.tile { cursor: pointer; }
button.tile:hover { border-color: var(--axis); }
button.tile[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: -1px; }
.tile .k { font-size: 12px; color: var(--ink-2); font-weight: 600; display: flex; gap: 6px; align-items: center; }
.tile .v { font-size: 26px; font-weight: 650; margin-top: 2px; line-height: 1.15; }
.tile .d { font-size: 12px; color: var(--muted); margin-top: 2px; }

/* Status tags (icono + texto, nunca solo color) */
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.tag.bad { color: var(--bad); } .tag.warn { color: var(--warn); } .tag.good { color: var(--good); } .tag.neutral { color: var(--muted); }
.tag svg { width: 12px; height: 12px; }

/* Tables */
.tbl-wrap { overflow: auto; max-height: 70vh; border: 1px solid var(--border); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 10px; border-bottom: 1px solid var(--grid); }
td:first-child { white-space: nowrap; }
thead th { position: sticky; top: 0; background: var(--surface-2); font-size: 12px; color: var(--ink-2); text-align: left; font-weight: 650; z-index: 1; white-space: nowrap; }
thead th.num { text-align: right; }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--ink); }
tbody tr:hover { background: var(--surface-2); }
tfoot td { font-weight: 700; border-top: 1px solid var(--axis); background: var(--surface-2); position: sticky; bottom: 0; }
td.nm { max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
tr.gap td { background: var(--gap-band); }
tr.sel td { background: var(--accent-wash); }
td input[type="checkbox"], th input[type="checkbox"] { width: 15px; height: 15px; cursor: pointer; accent-color: var(--accent); }

/* Resumen */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 0; }
.kv > div { padding: 6px 0; border-bottom: 1px solid var(--grid); }
.kv > .k { color: var(--ink-2); padding-right: 12px; }
.kv > .v { text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
.kv .ind { padding-left: 14px; font-weight: 500 !important; }
.kv input { width: 100px; text-align: right; padding: 4px 8px; border: 1px solid var(--axis); border-radius: 6px; background: var(--input-fill); font-weight: 650; }
.kv .hint { grid-column: 1 / -1; font-size: 12px; color: var(--muted); border-bottom: 0; padding: 0 0 6px; text-align: left !important; font-weight: 400 !important; }
.verdict { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); display: flex; gap: 8px; align-items: center; font-weight: 650; }
ul.insights { margin: 0; padding: 0; list-style: none; }
ul.insights li { display: grid; grid-template-columns: 18px 1fr; align-items: baseline; }
ul.insights li { margin-bottom: 8px; }
ul.defs { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 13px; }

/* Chart */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); margin-bottom: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
#tt { position: fixed; z-index: 50; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.15); padding: 8px 10px; font-size: 12px; min-width: 150px; }
#tt .h { color: var(--ink-2); font-weight: 600; margin-bottom: 4px; }
#tt .r { display: grid; grid-template-columns: 12px auto 1fr; gap: 6px; align-items: center; }
#tt .r i { height: 2px; border-radius: 1px; }
#tt .r b { font-variant-numeric: tabular-nums; }
#tt .r span { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
#tt .tot { border-top: 1px solid var(--grid); margin-top: 4px; padding-top: 4px; }

.drop { border: 2px dashed var(--axis); border-radius: 10px; padding: 26px 16px; display: grid; gap: 4px; justify-items: center; text-align: center; cursor: pointer; background: var(--surface-2); }
.drop:hover, .drop.over, .drop:focus-visible { border-color: var(--accent); background: var(--accent-wash); outline: none; }
ul.upl { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 6px; font-size: 13px; }
ul.upl li { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.q { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--axis); background: var(--surface); color: var(--ink-2); font-size: 10px; font-weight: 700; line-height: 1; padding: 0; margin-left: 5px; cursor: pointer; vertical-align: middle; flex: none; }
.q:hover, .q[aria-expanded="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
thead th .q { margin-left: 4px; }
#pop { position: fixed; z-index: 70; max-width: 300px; background: var(--surface); color: var(--ink); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.16); padding: 10px 12px; font-size: 12.5px; line-height: 1.45; font-weight: 400; text-transform: none; letter-spacing: 0; }
dialog.modal { border: 0; border-radius: 12px; padding: 0; width: calc(100% - 32px); max-width: 720px; background: var(--surface); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.3); }
dialog.modal::backdrop { background: rgba(0,0,0,.45); }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; background: var(--header-bg); color: var(--header-ink); border-bottom: 3px solid var(--orange); }
.modal-head h2 { margin: 0; font-size: 16px; }
.modal-head .btn { color: var(--header-ink); }
.modal-body { padding: 16px 18px; max-height: 70vh; overflow: auto; }
.modal-body h3 { font-size: 14px; margin: 16px 0 6px; color: var(--accent); }
.modal-body section:first-of-type h3 { margin-top: 4px; }
.modal-body p { margin: 0 0 6px; }
.modal-foot { padding: 10px 18px; border-top: 1px solid var(--grid); display: flex; justify-content: flex-end; }
.tkform { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
.tkform .field { display: grid; gap: 4px; margin: 0; }
.tkform .field > span { font-size: 12px; color: var(--ink-2); font-weight: 600; }
.tkform .full { grid-column: 1 / -1; }
.tkform label.chk { display: flex; gap: 8px; align-items: center; }
.tkform label.chk input { width: auto; flex: none; }
.tkform .chk > span { font-weight: 400; }
.tkform input[type=text], .tkform select, .tkform textarea, .modal-body textarea { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--axis); background: var(--surface); font: inherit; color: inherit; }
@media (max-width: 720px) { .tkform { grid-template-columns: 1fr; } }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.thumb { position: relative; width: 96px; height: 72px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); display: block; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb button { position: absolute; top: 2px; right: 2px; border: 0; border-radius: 50%; width: 20px; height: 20px; background: rgba(0,0,0,.6); color: #fff; cursor: pointer; line-height: 1; }
ul.hist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 13px; }
ul.hist li { border-left: 3px solid var(--accent); padding: 2px 0 2px 10px; }
.pre { white-space: pre-wrap; background: var(--surface-2); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
.okmsg { color: var(--good); font-weight: 600; }
tr.clic { cursor: pointer; }
.gestion { border-top: 1px solid var(--grid); margin-top: 14px; }
.empty { text-align: center; padding: 48px 16px; color: var(--ink-2); }
.empty h3 { color: var(--ink); margin: 0 0 6px; }
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.toolbar input[type="search"] { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--axis); background: var(--surface); width: 260px; max-width: 100%; }
.banner { padding: 10px 12px; border-radius: 8px; background: var(--surface-2); color: var(--ink-2); font-size: 13px; margin-bottom: 12px; }

/* Materia prima */
.mpname { display: inline-flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.mpname .nm2 { color: var(--ink-2); font-weight: 500; }
.mpsub { font-size: 12px; color: var(--muted); }
.mp-rel { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; font-size: 13px; }
.chipbtn { cursor: pointer; border: 1px solid var(--border); background: var(--surface-2); border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 600; color: var(--ink); }
.chipbtn:hover, .chipbtn:focus-visible { border-color: var(--accent); background: var(--accent-wash); outline: none; }
.mp-excel { display: flex; gap: 10px 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.mp-excel-st { display: flex; gap: 10px; align-items: baseline; flex: 1; min-width: 260px; }
.mp-excel-st .tag { flex: none; }
.warnmsg { color: var(--warn); }

/* ===================== Datos ===================== */
const esErrorRed = (e) => !e || /fetch|network|timeout|502|503|504/i.test(`${e.message} ${e.code} ${e.status}`);
const esSesionVencida = (e) => e && /jwt|PGRST301|PGRST303|401/i.test(`${e.message} ${e.code} ${e.status}`);
/** Llama una RPC paginando de a 1000 filas; reintenta cortes de red y renueva la sesión si venció. */
async function rpcTodo(fn, args, filtro) {
  const out = [];
  for (let from = 0; ; from += 1000) {
    let data, error;
    for (let intento = 0; intento < 3; intento++) {
      let q = sb.rpc(fn, args);
      if (filtro) q = filtro(q);
      ({ data, error } = await q.range(from, from + 999));
      if (!error) break;
      if (esSesionVencida(error) && intento === 0) { const r = await sb.auth.refreshSession(); if (r.error) { mostrarLogin(); throw new Error("La sesión venció: volvé a ingresar."); } continue; }
      if (!esErrorRed(error)) break;
      await new Promise((r) => setTimeout(r, 800 * (intento + 1)));
    }
    if (error) { registrarError("rpc " + fn, error); throw error; }
    out.push(...data);
    if (data.length < 1000) break;
  }
  return out;
}
async function cargarCatalogo() {
  const [cat, est] = await Promise.all([rpcTodo("rot_catalogo", {}), sb.rpc("rot_estado")]);
  const pres = [];
  for (const c of cat) for (const k of ["unid_30", "unid_90", "unid_365", "unid_total"]) c[k] = Number(c[k]) || 0;
  for (const p of pres) { p.unid_pub_90 = Number(p.unid_pub_90) || 0; p.unid_90 = Number(p.unid_90) || 0; }
  state.catalogo = cat;
  state.catMap = new Map(cat.map((c) => [c.sku_base, c]));
  state.pres = pres;
  state.presMap = new Map(pres.map((p) => [p.sku_codigo, p]));
  state.presPorBase = new Map();
  for (const p of pres) { if (!state.presPorBase.has(p.sku_base)) state.presPorBase.set(p.sku_base, []); state.presPorBase.get(p.sku_base).push(p); }
  for (const l of state.presPorBase.values()) l.sort((a, b) => b.unid_90 - a.unid_90 || a.sku_codigo.localeCompare(b.sku_codigo));
  const e = est.data && est.data[0];
  if (e && e.actualizado) state.refresco.datosAl = e.actualizado;
  pintarFrescura();
}
const filaDia = (f, clave) => {
  const uv = Number(f.unid_validas) || 0;
  return { fecha: f.fecha, base: clave, cod: clave, canal: f.canal, lg: f.logistica, may: f.mayorista === true,
    uv, unv: Number(f.unid_no_validas) || 0, upub: uv, ing: Number(f.ingreso) || 0, car: Number(f.cargos) || 0, ven: f.ventas || 0 };
};
/** Trae las filas diarias de las claves pedidas (TODOS y/o SKUs). Con `desde`, solo desde esa fecha. Devuelve Map clave -> filas. */
async function traerDiario(claves, desde) {
  const out = new Map();
  if (claves.includes(TODOS)) {
    let filas;
    if (desde) {
      try { filas = await rpcTodo("rot_diario_total_desde", { p_desde: desde }); }
      catch (e) { if (!faltaBaseMP(e)) throw e; filas = (await rpcTodo("rot_diario_total", {})).filter((f) => f.fecha >= desde); } // base sin la función nueva
    } else filas = await rpcTodo("rot_diario_total", {});
    out.set(TODOS, filas.map((f) => filaDia(f, TODOS)));
  }
  const skus = claves.filter((k) => k !== TODOS);
  if (skus.length) {
    const filas = await rpcTodo("rot_diario_det", { p_skus: skus }, desde ? (q) => q.gte("fecha", desde) : null);
    for (const k of skus) out.set(k, []);
    for (const f of filas) { if (!out.has(f.sku)) out.set(f.sku, []); out.get(f.sku).push(filaDia(f, f.sku)); }
  }
  return out;
}
async function asegurarDatos(skus) {
  const faltan = [...new Set(skus.map(baseDe))].filter((k) => !state.cache.has(k));
  if (!faltan.length) return;
  for (const [k, filas] of await traerDiario(faltan)) state.cache.set(k, filas);
}
/** Filas de la selección, cada una etiquetada con la clave seleccionada (base o presentación). */
function filasSeleccion() {
  const out = [];
  for (const k of selEf()) {
    const rows = state.cache.get(baseDe(k)) || [];
    const cod = codeOf(k);
    for (const f of rows) if (esBase(k) || f.cod === cod) out.push({ ...f, sku: k });
  }
  return out.filter((f) => (state.canal === "todos" || f.canal === state.canal)
    && (state.envio === "todos" || f.lg === state.envio)
    && (state.mayorista === "todos" || (state.mayorista === "si" ? f.may : !f.may)));
}

/* ===================== Cálculo (misma lógica que el Excel) ===================== */
function calcular() {
  const skus = selEf();
  const filas = filasSeleccion();

  // corte por defecto: HOY (día en curso incluido). Para ver solo días completos: Rango con hasta = ayer.
  let fin = state.periodo === "custom" && state.hasta ? state.hasta : hoyAR();
  const conVenta = filas.filter((f) => f.uv > 0);
  const primeraVentaTotal = conVenta.length ? conVenta.reduce((m, f) => (f.fecha < m ? f.fecha : m), "9999") : null;
  let desde;
  const nFin = dn(fin);
  if (state.periodo === "90d") desde = iso(nFin - 89);
  else if (state.periodo === "6m") desde = iso(nFin - 182);
  else if (state.periodo === "12m") desde = iso(nFin - 364);
  else if (state.periodo === "custom" && state.desde) desde = state.desde;
  else desde = primeraVentaTotal || fin;
  // el calendario arranca con la primera venta (no antes) para no contar "huecos" previos al lanzamiento
  if (primeraVentaTotal && primeraVentaTotal > desde) desde = primeraVentaTotal;
  if (desde > fin) desde = fin;

  const n0 = dn(desde), n1 = dn(fin), nd = n1 - n0 + 1;
  // índice diario sobre TODA la historia (para velocidades) y luego se recorta al período
  const porDia = new Map();
  for (const f of filas) {
    let d = porDia.get(f.fecha);
    if (!d) { d = { uv: 0, unv: 0, ing: 0, ingML: 0, car: 0, ven: 0, uvFull: 0, venMay: 0, uvMay: 0, porSku: {} }; porDia.set(f.fecha, d); }
    if (f.lg === "full") d.uvFull += f.uv;
    if (f.may) { d.venMay += f.ven; d.uvMay += f.uv; }
    d.uv += f.uv; d.unv += f.unv; d.ing += f.ing; d.car += f.car; d.ven += f.ven;
    if (f.canal === "mercadolibre") d.ingML += f.ing;
    d.porSku[f.sku] = (d.porSku[f.sku] || 0) + f.uv;
  }

  const dias = [];
  let racha = 0;
  for (let i = 0; i < nd; i++) {
    const fecha = iso(n0 + i);
    const d = porDia.get(fecha) || { uv: 0, unv: 0, ing: 0, ingML: 0, car: 0, ven: 0, uvFull: 0, venMay: 0, uvMay: 0, porSku: {} };
    racha = d.uv > 0 ? 0 : racha + 1;
    dias.push({ fecha, mes: fecha.slice(0, 7), ...d, neto: d.ing - d.car, racha });
  }
  // marcar rachas >= 3 completas (todos los días de la racha, no solo desde el 3°)
  const huecos = [];
  for (let i = 0; i < dias.length; ) {
    if (dias[i].uv === 0) {
      let j = i; while (j < dias.length && dias[j].uv === 0) j++;
      if (j - i >= UMBRALES.rachaDias) { huecos.push({ desde: dias[i].fecha, hasta: dias[j - 1].fecha, n: j - i, i0: i, i1: j - 1 }); for (let k = i; k < j; k++) dias[k].hueco = true; }
      i = j;
    } else i++;
  }

  // meses
  const mesesMap = new Map();
  for (const d of dias) {
    let m = mesesMap.get(d.mes);
    if (!m) { m = { mes: d.mes, uv: 0, unv: 0, ven: 0, ing: 0, ingML: 0, car: 0, uvFull: 0, venMay: 0, uvMay: 0, diasVenta: 0, diasPer: 0, porSku: {} }; mesesMap.set(d.mes, m); }
    m.uvFull += d.uvFull; m.venMay += d.venMay; m.uvMay += d.uvMay; m.ven += d.ven; m.uv += d.uv; m.unv += d.unv; m.ing += d.ing; m.ingML += d.ingML; m.car += d.car; m.diasPer++; if (d.uv > 0) m.diasVenta++;
    for (const [k, v] of Object.entries(d.porSku)) m.porSku[k] = (m.porSku[k] || 0) + v;
  }
  const meses = [...mesesMap.values()];

  // velocidades relativas al corte (usan historia completa, no solo el período)
  const sumaVentana = (n) => { let t = 0; for (const [f, d] of porDia) { const x = dn(f); if (x > n1 - n && x <= n1) t += d.uv; } return t; };
  const v30 = sumaVentana(30) / 30, v60 = sumaVentana(60) / 60, v90 = sumaVentana(90) / 90;
  let sinVenta90 = 0; for (let x = n1 - 89; x <= n1; x++) { const d = porDia.get(iso(x)); if (!d || d.uv === 0) sinVenta90++; }
  // si el SKU es más nuevo que 90 días, no contar días previos al lanzamiento
  if (primeraVentaTotal && dn(primeraVentaTotal) > n1 - 89) sinVenta90 -= dn(primeraVentaTotal) - (n1 - 89);

  const porSku = skus.map((k) => {
    const fs = filas.filter((f) => f.sku === k);
    const enPer = fs.filter((f) => f.fecha >= desde && f.fecha <= fin);
    const ventas = fs.filter((f) => f.uv > 0 && f.fecha <= fin);
    let u30 = 0; for (const f of fs) { const x = dn(f.fecha); if (x > n1 - 30 && x <= n1) u30 += f.uv; }
    return {
      sku: k, nombre: nombreSku(k),
      uv: enPer.reduce((a, f) => a + f.uv, 0), unv: enPer.reduce((a, f) => a + f.unv, 0), ing: enPer.reduce((a, f) => a + f.ing, 0),
      v30: u30 / 30,
      primera: ventas.length ? ventas.reduce((m, f) => (f.fecha < m ? f.fecha : m), "9999") : null,
      ultima: ventas.length ? ventas.reduce((m, f) => (f.fecha > m ? f.fecha : m), "0000") : null,
    };
  });

  // desglose por presentación (dentro del período)
  const pm = new Map();
  for (const f of filas) {
    if (f.fecha < desde || f.fecha > fin) continue;
    let x = pm.get(f.cod);
    if (!x) { x = { cod: f.cod, base: f.base, uv: 0, upub: 0, unv: 0, ing: 0, ultima: null, canales: new Set() }; pm.set(f.cod, x); }
    x.uv += f.uv; x.upub += f.upub; x.unv += f.unv; x.ing += f.ing; x.canales.add(f.canal);
    if (f.uv > 0 && (!x.ultima || f.fecha > x.ultima)) x.ultima = f.fecha;
  }
  const porPres = [...pm.values()].sort((a, b) => a.base.localeCompare(b.base, "es", { numeric: true }) || b.uv - a.uv);
  const tot = dias.reduce((a, d) => ({ uv: a.uv + d.uv, unv: a.unv + d.unv, ven: a.ven + d.ven, ing: a.ing + d.ing, ingML: a.ingML + d.ingML, car: a.car + d.car, uvFull: a.uvFull + d.uvFull, venMay: a.venMay + d.venMay, uvMay: a.uvMay + d.uvMay }), { uv: 0, unv: 0, ven: 0, ing: 0, ingML: 0, car: 0, uvFull: 0, venMay: 0, uvMay: 0 });
  const ultimaVenta = porSku.reduce((m, p) => (p.ultima && p.ultima > m ? p.ultima : m), "");
  return { desde, fin, dias, meses, huecos, tot, porPres, v30, v60, v90, sinVenta90, rachaMax: dias.reduce((m, d) => Math.max(m, d.racha), 0), porSku, ultimaVenta, hayDatos: filas.length > 0 };
}

/* ===================== Gráfico de barras apiladas (SVG) ===================== */
function niceMax(v) {
  const raw = v / 4, mag = Math.pow(10, Math.floor(Math.log10(raw || 1))), n = raw / mag;
  const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
  return { max: step * 4, step };
}
function topPath(x, y, w, hh, r) {
  r = Math.min(r, w / 2, hh);

}
function barChart(el, { labels, series, height = 260, xLabel, tipTitle, bands = [], bandLabel, ticks, fmt = (v) => nf0.format(v) }) {
  el.textContent = "";

  const m = { t: 10, r: 8, b: 26, l: 46 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b, n = labels.length;
  const totals = labels.map((_, i) => series.reduce((a, se) => a + (se.values[i] || 0), 0));
  const { max, step } = niceMax(Math.max(1, ...totals));
  const band = iw / Math.max(1, n);
  const gap = band >= 8 ? 2 : band >= 4 ? 1 : 0;
  const bw = Math.max(1, band - gap);
  const y = (v) => m.t + ih - (v / max) * ih;
  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, height: H, role: "img" });

  for (const b of bands) svg.append(s("rect", { x: m.l + b.i0 * band, y: m.t, width: (b.i1 - b.i0 + 1) * band, height: ih, fill: "var(--gap-band)" }));
  for (let v = 0; v <= max + 1e-9; v += step) {
    svg.append(s("line", { x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), stroke: v === 0 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }));
    const t = s("text", { x: m.l - 6, y: y(v) + 4, "text-anchor": "end" }); t.textContent = fmt(v); svg.append(t);
  }
  const stroke = bw >= 6;
  for (let i = 0; i < n; i++) {
    let acc = 0;
    const x = m.l + i * band + gap / 2;
    const vivos = series.filter((se) => (se.values[i] || 0) > 0);
    vivos.forEach((se, j) => {
      const v = se.values[i], y0 = y(acc), y1 = y(acc + v), hh = Math.max(0.5, y0 - y1);
      const top = j === vivos.length - 1 && bw >= 8;
      const el2 = top ? s("path", { d: topPath(x, y1, bw, hh, 3) }) : s("rect", { x, y: y1, width: bw, height: hh });
      el2.setAttribute("fill", se.color);
      if (stroke && j > 0) { el2.setAttribute("stroke", "var(--surface)"); el2.setAttribute("stroke-width", "1"); }
      svg.append(el2);
      acc += v;
    });
  }
  // eje X: etiquetas espaciadas >= 56px
  const every = Math.max(1, Math.ceil(56 / band));
  let idx = [];
  if (ticks) { let last = -Infinity; for (const i of ticks) if ((i - last) * band >= 48) { idx.push(i); last = i; } }
  else for (let i = 0; i < n; i += every) idx.push(i);
  for (const i of idx) {
    const t = s("text", { x: m.l + i * band + band / 2, y: H - 8, "text-anchor": "middle" }); t.textContent = xLabel(labels[i], i); svg.append(t);
  }
  // capa de hover: la columna entera es el blanco
  const hl = s("rect", { y: m.t, height: ih, fill: "var(--ink)", opacity: 0, "pointer-events": "none" });
  svg.append(hl);
  const hit = s("rect", { x: m.l, y: m.t, width: iw, height: ih, fill: "transparent", tabindex: 0, "aria-label": "Gráfico: pasá el mouse para ver valores" });
  svg.append(hit);
  const tt = $("#tt");
  const show = (i, cx, cy) => {
    hl.setAttribute("x", m.l + i * band); hl.setAttribute("width", band); hl.setAttribute("opacity", 0.06);
    tt.textContent = "";
    tt.append(h("div", { class: "h", text: tipTitle(labels[i], i) }));
    for (const se of series) {
      const v = se.values[i] || 0;
      if (!v && series.length > 6) continue;

async function subirArchivos(files) {
  const validos = files.filter((f) => /\.(csv|xlsx)$/i.test(f.name));
  for (const f of files) if (!validos.includes(f)) datosUI.log.unshift({ nombre: f.name, estado: "error", msg: "Formato no soportado: tiene que ser .csv o .xlsx" });
  render();
  for (const f of validos) {
    const item = { nombre: f.name, estado: "en_curso", msg: "Subiendo…" };
    datosUI.log.unshift(item); render();
    const ahora = new Intl.DateTimeFormat("sv-SE", { timeZone: TZ, dateStyle: "short", timeStyle: "medium" }).format(new Date()).replace(" ", "_").replace(/:/g, "");
    const limpio = f.name.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^A-Za-z0-9._-]+/g, "_");
    const path = `tienda/${ahora}_${limpio}`;
    const tipo = /\.csv$/i.test(f.name) ? "text/csv" : "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
    const up = await sb.storage.from(BUCKET).upload(path, f, { contentType: tipo, upsert: false });
    if (up.error) { Object.assign(item, { estado: "error", msg: "No se pudo subir: " + up.error.message }); render(); continue; }
    item.msg = "Procesando… (puede tardar hasta un minuto)"; render();
    const { data, error } = await sb.functions.invoke("ml-historico-import/procesar", { body: { path } });
    if (error) {
      let msg = error.message;
      try { msg = (await error.context.json()).error || msg; } catch {}
      Object.assign(item, { estado: "pendiente", msg: "Subido. No se pudo procesar ahora (" + msg + "): se procesa solo en los próximos 10 minutos." });
    } else {
      const a = data && data.archivo;
      if (a && a.estado === "ok") Object.assign(item, { estado: "ok", msg: `Listo: ${nf0.format(a.filas_cargadas)} líneas cargadas${a.descartadas ? `, ${nf0.format(a.descartadas)} descartadas` : ""}.` });
      else if (a && a.estado === "error") Object.assign(item, { estado: "error", msg: a.ultimo_error || "Error al procesar" });
      else Object.assign(item, { estado: "pendiente", msg: "Subido y en cola: se termina de procesar en los próximos minutos." });
    }
    render();
  }
  state.cache.clear();
  try { await cargarCatalogo(); } catch {}
  render();
}


/* ===================== Materia prima: lógica pura (sin pantalla, se puede probar aparte) =====================
   Lee lo que devuelve el agente local de Excel, arma la relación SKU → materia prima,
   valida, compara contra la copia guardada y calcula la cadena (misma regla que rot_mp_arbol_base en Supabase). */
const MP = (() => {
  const normTxt = (x) => String(x ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, " ").trim().toLowerCase();
  const normSku = (x) => { const v = String(x ?? "").trim().replace(/\s+/g, " ").toUpperCase(); return v || null; };
  const fmtN = (v) => (v === null || v === undefined ? "vacío" : String(+v.toFixed(6)).replace(".", ","));

  /** Número desde una celda: 16, "16", "1.6", "1,6", "4.76190476190476". Errores (#N/A), texto o vacío → null. */
  function num(v) {
    if (typeof v === "number") return Number.isFinite(v) ? v : null;
    let s = String(v ?? "").trim();
    if (!s) return null;
    if (/^-?\d+,\d+$/.test(s)) s = s.replace(",", ".");
    if (!/^-?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(s)) return null;
    const n = Number(s);
    return Number.isFinite(n) ? n : null;
  }
  const igualNum = (a, b) => (a === null || b === null ? a === b : Math.abs(a - b) <= 1e-9 * Math.max(1, Math.abs(a)));

  /** Busca cada campo por el texto del encabezado (sin mayúsculas, acentos ni espacios de más). */
  function buscarColumnas(encabezados, def) {
    const letras = {}, textos = {}, faltan = [];
    for (const [campo, alias] of Object.entries(def.cols)) {
      const al = alias.map(normTxt);
      const e = (encabezados || []).find((x) => x && al.includes(normTxt(x.texto)));
      if (e) { letras[campo] = e.letra; textos[campo] = e.texto; }
      else if ((def.obligatorias || []).includes(campo)) faltan.push(alias[0]);
    }
    return { letras, textos, faltan };
  }

  const celda = (f, letras, campo) => (letras[campo] && f && f.v ? String(f.v[letras[campo]] ?? "").trim() : "");
  const esError = (s) => /^#/.test(s);
  const esSkuValido = (s) => /^[^\s-].* - \S/.test(s);
  const codigo = (s) => (s && !esError(s) ? normSku(s) : null);

  /** Filas de BASE GENERAL → productos. */
  function parsearProductos(filas, letras, ignorar = []) {
    const out = [], ignoradas = [];
    for (const f of filas || []) {
      const sku = celda(f, letras, "sku").replace(/\s+/g, " ");
      if (!esSkuValido(sku) || ignorar.some((re) => re.test(sku))) {
        if (!ignorar.some((re) => re.test(sku)) && (sku || celda(f, letras, "codigo_mp"))) ignoradas.push({ fila: f.fila, sku });
        continue;
      }
      const crudo = { codigo_mp: celda(f, letras, "codigo_mp"), unid_total: celda(f, letras, "unid_total"), division: celda(f, letras, "division"), cant_padre: celda(f, letras, "cant_padre") };
      out.push({
        sku, codigo_mp: codigo(crudo.codigo_mp), tipo: celda(f, letras, "tipo") || null,
        unid_total: num(crudo.unid_total), division: num(crudo.division), cant_padre: num(crudo.cant_padre),
        fila: f.fila, _crudo: crudo,
      });
    }
    return { filas: out, ignoradas };
  }

  /** Filas de MATERIA PRIMA → materias primas. */
  function parsearMaterias(filas, letras) {
    const out = [], ignoradas = [];
    for (const f of filas || []) {
      const crudo = celda(f, letras, "codigo");
      const cod = codigo(crudo);
      if (!cod) { if (crudo) ignoradas.push({ fila: f.fila, codigo: crudo }); continue; }
      const padre = (c) => { const x = codigo(celda(f, letras, c)); return x && x !== cod ? x : null; };
      out.push({
        codigo: cod, sku: celda(f, letras, "sku") || null, cant_minima: num(celda(f, letras, "cant_minima")), unidad: celda(f, letras, "unidad") || null,
        padre1: padre("padre1"), div1: num(celda(f, letras, "div1")), padre2: padre("padre2"), div2: num(celda(f, letras, "div2")),
        padre_corte: padre("padre_corte"), fila: f.fila,
      });
    }
    return { filas: out, ignoradas };
  }

  /** Materia prima que consume 1 unidad vendida del SKU (en unidades de su MP directa). División vacía = 1. */
  function factorProducto(p) {
    const d = p.division === null || p.division === undefined ? 1 : p.division;
    return p.unid_total > 0 && d > 0 && p.cant_padre > 0 ? p.unid_total / d / p.cant_padre : null;
  }

  /** Aristas hijo → padre (con dividendo; null = sin factor). */
  function aristasDe(materias) {
    const ar = new Map();
    const add = (h, p, d) => { if (!ar.has(h)) ar.set(h, []); ar.get(h).push({ p, d }); };
    for (const m of materias) {
      if (m.padre1) add(m.codigo, m.padre1, m.div1);
      if (m.padre2) add(m.codigo, m.padre2, m.div2);
      if (!m.padre1 && m.padre_corte) add(m.codigo, m.padre_corte, null);
    }
    return ar;
  }

  /** Árbol SKU → cada MP de la que depende. Misma regla que rot_mp_arbol_base() (máx. 6 niveles, sin ciclos). */
  function arbol(productos, materias) {
    const ar = aristasDe(materias);
    const out = new Map();
    for (const p of productos) {
      if (!p.codigo_mp) continue;
      const n = normSku(p.sku), f0 = factorProducto(p);
      const pila = [{ codigo: p.codigo_mp, nivel: 1, factor: f0, sin: f0 === null, camino: [p.codigo_mp] }];
      while (pila.length) {
        const r = pila.pop();
        const k = n + "|" + r.codigo, via = r.camino.join(" → ");
        const prev = out.get(k);
        if (!prev) out.set(k, { sku: p.sku, sku_norm: n, codigo: r.codigo, nivel: r.nivel, sin_factor: r.sin, suma: r.sin ? 0 : r.factor, vias: [{ nivel: r.nivel, via }] });
        else { prev.sin_factor = prev.sin_factor || r.sin; prev.suma += r.sin ? 0 : r.factor; prev.nivel = Math.min(prev.nivel, r.nivel); prev.vias.push({ nivel: r.nivel, via }); }
        if (r.nivel >= 6) continue;
        for (const a of ar.get(r.codigo) || []) {
          if (r.camino.includes(a.p)) continue;
          const ok = (a.d || 0) > 0;
          pila.push({ codigo: a.p, nivel: r.nivel + 1, factor: !r.sin && ok ? r.factor / a.d : null, sin: r.sin || !ok, camino: [...r.camino, a.p] });
        }
      }
    }
    return [...out.values()].map((x) => {
      x.vias.sort((a, b) => a.nivel - b.nivel || (a.via < b.via ? -1 : a.via > b.via ? 1 : 0));
      return { sku: x.sku, sku_norm: x.sku_norm, codigo: x.codigo, nivel: x.nivel, factor: x.sin_factor ? null : x.suma, via: x.vias[0].via, sin_factor: x.sin_factor };
    });
  }

  function deduplicar(lista, clave, igual) {
    const vistos = new Map(), out = [], dups = [];
    for (const x of lista) {
      const k = clave(x), prev = vistos.get(k);
      if (!prev) { vistos.set(k, x); out.push(x); continue; }
      dups.push({ x, fila: x.fila, filaUsada: prev.fila, igual: igual(prev, x) });
    }
    return { lista: out, dups };
  }

  /** Ciclos entre materias primas (A sale de B y B sale de A). */
  function ciclos(materias) {
    const ar = aristasDe(materias), color = new Map(), enCiclo = new Set();
    const visitar = (c, pila) => {
      color.set(c, 1); pila.push(c);
      for (const a of ar.get(c) || []) {
        if (color.get(a.p) === 1) pila.slice(pila.indexOf(a.p)).forEach((x) => enCiclo.add(x));
        else if (!color.get(a.p)) visitar(a.p, pila);
      }
      pila.pop(); color.set(c, 2);
    };
    for (const m of materias) if (!color.get(m.codigo)) visitar(m.codigo, []);
    return enCiclo;
  }

  /** Avisos de datos del Excel. No frenan el guardado: se muestran para que Stock los corrija. */
  function validar(productos, materias, dupsP, dupsM, ignoradas) {
    const adv = [];
    const mats = new Map(materias.map((m) => [m.codigo, m]));
    for (const d of dupsP) adv.push(d.igual
      ? { tipo: "sku_duplicado", sku: d.x.sku, fila: d.fila, msg: `Repetido: igual a la fila ${d.filaUsada}` }
      : { tipo: "sku_duplicado_distinto", sku: d.x.sku, fila: d.fila, msg: `Repetido con otra materia prima o factor: se usa la fila ${d.filaUsada}` });
    for (const d of dupsM) adv.push({ tipo: "mp_duplicada", codigo: d.x.codigo, fila: d.fila, msg: `Código repetido: se usa la fila ${d.filaUsada}` });
    for (const p of productos) {
      const c = p._crudo || {};
      if (!p.codigo_mp) { adv.push({ tipo: "sin_mp", sku: p.sku, fila: p.fila, msg: c.codigo_mp ? `"codigo mat prima" con error (${c.codigo_mp})` : "Sin \"codigo mat prima\"" }); continue; }
      if (!mats.has(p.codigo_mp)) adv.push({ tipo: "mp_inexistente", sku: p.sku, fila: p.fila, msg: `La materia prima ${p.codigo_mp} no está en la hoja MATERIA PRIMA` });
      if (factorProducto(p) === null) adv.push({ tipo: "sin_factor", sku: p.sku, fila: p.fila,
        msg: `No se puede convertir: Cant. Unidades Total = ${c.unid_total || fmtN(p.unid_total)}, División = ${c.division || "vacío"}, Cantidad del Padre = ${c.cant_padre || fmtN(p.cant_padre)}` });
    }
    const enCiclo = ciclos(materias);
    for (const m of materias) {
      for (const [pc, dc, n] of [["padre1", "div1", 1], ["padre2", "div2", 2]]) {
        if (!m[pc]) continue;
        if (!mats.has(m[pc])) adv.push({ tipo: "padre_inexistente", codigo: m.codigo, fila: m.fila, msg: `Sale de ${m[pc]} (CODIGO ${n}), que no está en la hoja MATERIA PRIMA` });
        if (!(m[dc] > 0)) adv.push({ tipo: "padre_sin_factor", codigo: m.codigo, fila: m.fila, msg: `Sale de ${m[pc]} pero "Dividendo materia prima ${n}" está vacío o en 0` });
      }
      if (!m.padre1 && m.padre_corte) adv.push({ tipo: "corte_sin_factor", codigo: m.codigo, fila: m.fila, msg: `Sale de ${m.padre_corte} (columna de papeles cortados) sin CODIGO 1 ni dividendo: su consumo no se lleva a ${m.padre_corte}` });
      if (m.padre1 && m.padre_corte && m.padre_corte !== m.padre1 && m.padre_corte !== m.padre2) adv.push({ tipo: "corte_distinto", codigo: m.codigo, fila: m.fila, msg: `CODIGO 1 dice ${m.padre1} y la columna de papeles cortados dice ${m.padre_corte}: se usa ${m.padre1}` });
      if (enCiclo.has(m.codigo)) adv.push({ tipo: "ciclo", codigo: m.codigo, fila: m.fila, msg: "Forma parte de una cadena circular (una materia prima sale de otra que sale de ella)" });
    }
    for (const i of ignoradas) adv.push({ tipo: "fila_ignorada", hoja: i.hoja, sku: i.sku || i.codigo || "", fila: i.fila, msg: `Fila de ${i.hoja} sin ${i.hoja === "MATERIA PRIMA" ? "código válido" : "SKU válido"}: no se copia` });
    return adv;
  }

  /** Lectura completa → lo que se guarda (sin duplicados) + avisos. */
  function preparar(prod, mat, hojas = {}) {
    const dp = deduplicar(prod.filas, (p) => normSku(p.sku), (a, b) => a.codigo_mp === b.codigo_mp && igualNum(factorProducto(a), factorProducto(b)));
    const dm = deduplicar(mat.filas, (m) => m.codigo, (a, b) => a.padre1 === b.padre1 && igualNum(a.div1, b.div1));
    const ign = [...prod.ignoradas.map((i) => ({ ...i, hoja: hojas.productos || "BASE GENERAL" })), ...mat.ignoradas.map((i) => ({ ...i, hoja: hojas.materias || "MATERIA PRIMA" }))];
    return { productos: dp.lista, materias: dm.lista, advertencias: validar(dp.lista, dm.lista, dp.dups, dm.dups, ign) };
  }

  /** Qué cambia entre la copia guardada y lo leído del Excel. */
  function diff(guardado, nuevo) {
    const g = guardado || { productos: [], materias: [] };
    const cambios = [];
    const fP = (p) => { const f = factorProducto(p); return f === null ? "sin factor" : `${fmtN(f)} por unidad`; };
    const dP = (p) => `MP ${p.codigo_mp || "—"} · ${fP(p)}`;
    const gp = new Map(g.productos.map((p) => [normSku(p.sku), p]));
    const np = new Map(nuevo.productos.map((p) => [normSku(p.sku), p]));
    for (const [k, p] of np) {
      const o = gp.get(k);
      if (!o) cambios.push({ tipo: "sku_nuevo", clave: p.sku, antes: "—", ahora: dP(p) });
      else if ((o.codigo_mp || null) !== (p.codigo_mp || null) || !igualNum(factorProducto(o), factorProducto(p))) cambios.push({ tipo: "sku_cambio", clave: p.sku, antes: dP(o), ahora: dP(p) });
    }
    for (const [k, o] of gp) if (!np.has(k)) cambios.push({ tipo: "sku_quitado", clave: o.sku, antes: dP(o), ahora: "—" });
    const dM = (m) => {
      const rel = [m.padre1 ? `sale de ${m.padre1} ÷${fmtN(m.div1)}` : null, m.padre2 ? `y de ${m.padre2} ÷${fmtN(m.div2)}` : null,
        !m.padre1 && m.padre_corte ? `sale de ${m.padre_corte} (sin factor)` : null].filter(Boolean).join(" ");
      return `${m.sku || m.codigo}${m.unidad ? ` · ${m.unidad}` : ""}${m.cant_minima > 1 ? ` ×${fmtN(m.cant_minima)}` : ""}${rel ? ` · ${rel}` : ""}`;
    };
    const gm = new Map(g.materias.map((m) => [m.codigo, m]));
    const nm = new Map(nuevo.materias.map((m) => [m.codigo, m]));
    const CAMPOS = ["sku", "unidad", "padre1", "padre2", "padre_corte"], NUMS = ["cant_minima", "div1", "div2"];
    for (const [k, m] of nm) {
      const o = gm.get(k);
      if (!o) cambios.push({ tipo: "mp_nueva", clave: m.codigo, antes: "—", ahora: dM(m) });
      else if (CAMPOS.some((c) => (o[c] || null) !== (m[c] || null)) || NUMS.some((c) => !igualNum(o[c] ?? null, m[c] ?? null))) cambios.push({ tipo: "mp_cambio", clave: m.codigo, antes: dM(o), ahora: dM(m) });
    }
    for (const [k, o] of gm) if (!nm.has(k)) cambios.push({ tipo: "mp_quitada", clave: o.codigo, antes: dM(o), ahora: "—" });
    const cuenta = {};
    for (const c of cambios) cuenta[c.tipo] = (cuenta[c.tipo] || 0) + 1;
    return { cambios, n: cambios.length, cuenta, primeraCarga: !g.productos.length };
  }

  /** Lo que se manda a la base (sin campos internos). */
  function paraGuardar(lectura) {
    return {
      productos: lectura.productos.map((p) => ({ sku: p.sku, codigo_mp: p.codigo_mp, tipo: p.tipo, unid_total: p.unid_total, division: p.division, cant_padre: p.cant_padre, fila: p.fila })),
      materias: lectura.materias.map((m) => ({ codigo: m.codigo, sku: m.sku, cant_minima: m.cant_minima, unidad: m.unidad, padre1: m.padre1, div1: m.div1, padre2: m.padre2, div2: m.div2, padre_corte: m.padre_corte, fila: m.fila })),
      advertencias: lectura.advertencias.slice(0, 500).map((a) => ({ tipo: a.tipo, sku: a.sku || null, codigo: a.codigo || null, fila: a.fila ?? null, hoja: a.hoja || null, msg: a.msg })),
    };
  }

  return { normTxt, normSku, num, igualNum, buscarColumnas, parsearProductos, parsearMaterias, factorProducto, arbol, preparar, diff, paraGuardar, ciclos };
})();

/* ---------- MATERIA PRIMA (pestaña) ----------
   Datos: rot_mp_arbol (SKU → cada MP de la que depende, con factor), rot_mp_mapeo (copia del Excel)
   y rot_mp_mensual (consumo por mes). Ventas: el mismo catálogo de Inicio (rot_catalogo).
   El Excel se lee con el agente local (MP_CFG.agenteUrl) y se guarda con rot_mp_guardar. */
const fC = (v) => (v === null || v === undefined || !isFinite(v) || v === 0 ? "–" : Math.abs(v) >= 100 ? nf0.format(v) : Math.abs(v) >= 10 ? nf1.format(v) : nf2.format(v));
const nf4 = new Intl.NumberFormat("es-AR", { maximumFractionDigits: 4 });
const fF = (v) => (v === null || v === undefined || !isFinite(v) ? "sin factor" : nf4.format(v));
const horaCorta = (d) => (d ? new Date(d).toLocaleTimeString("es-AR", { timeZone: TZ, hour: "2-digit", minute: "2-digit" }) : "–");
const esMovil = () => matchMedia("(pointer: coarse)").matches && !matchMedia("(pointer: fine)").matches;
const faltaBaseMP = (e) => !!e && /PGRST202|Could not find the function|does not exist/i.test(`${e.code || ""} ${e.message || ""}`);
const descMP = (m, cod) => { const t = (m && m.sku) || ""; const i = t.indexOf(" - "); return i >= 0 ? t.slice(i + 3) : t || cod; };
function unidadMP(m) {
  if (!m) return "u.";
  const u = (m.unidad || "u.").trim();
  return m.cant_minima > 1 ? `paq. ×${nf0.format(m.cant_minima)} ${u}` : u;
}
const ADV_MP = {
  sku_duplicado_distinto: { nivel: "alta", t: "SKU repetido con distinta materia prima o factor" },
  sin_factor: { nivel: "alta", t: "SKU sin factor de conversión" },
  mp_inexistente: { nivel: "alta", t: "SKU con una materia prima que no existe en MATERIA PRIMA" },
  ciclo: { nivel: "alta", t: "Cadena circular entre materias primas" },
  padre_inexistente: { nivel: "media", t: "Materia prima que sale de un código inexistente" },
  padre_sin_factor: { nivel: "media", t: "Materia prima con CODIGO 1/2 pero sin dividendo" },
  corte_sin_factor: { nivel: "media", t: "Papel cortado sin CODIGO 1 ni dividendo (no suma al padre)" },
  corte_distinto: { nivel: "media", t: "CODIGO 1 distinto de la columna de papeles cortados" },
  sin_mp: { nivel: "media", t: "SKU sin código de materia prima" },
  sku_duplicado: { nivel: "baja", t: "SKU repetido (mismos datos)" },
  mp_duplicada: { nivel: "baja", t: "Código de materia prima repetido" },
  fila_ignorada: { nivel: "baja", t: "Fila sin SKU o código válido (no se copia)" },
};
const NIVEL_ORDEN = { alta: 0, media: 1, baja: 2 };
const TIPO_CAMBIO = { sku_nuevo: "SKU nuevo", sku_cambio: "SKU cambiado", sku_quitado: "SKU que ya no está", mp_nueva: "MP nueva", mp_cambio: "MP cambiada", mp_quitada: "MP que ya no está" };

/* ---- carga desde la base ---- */
async function rpcUno(fn, args) {
  let data, error;
  for (let intento = 0; intento < 3; intento++) {
    ({ data, error } = await sb.rpc(fn, args || {}));
    if (!error) return data;
    if (esSesionVencida(error) && intento === 0) { const r = await sb.auth.refreshSession(); if (r.error) { mostrarLogin(); throw new Error("La sesión venció: volvé a ingresar."); } continue; }
    if (!esErrorRed(error)) break;
    await new Promise((r) => setTimeout(r, 800 * (intento + 1)));
  }
  registrarError("rpc " + fn, error);
  throw error;
}
function normalizarMapeo(x) {
  const n = (v) => (v === null || v === undefined || v === "" ? null : Number(v));
  return {
    productos: (x?.productos || []).map((p) => ({ sku: p.sku, codigo_mp: p.codigo_mp || null, tipo: p.tipo || null, unid_total: n(p.unid_total), division: n(p.division), cant_padre: n(p.cant_padre), fila: p.fila ?? null })),
    materias: (x?.materias || []).map((m) => ({ codigo: m.codigo, sku: m.sku || null, cant_minima: n(m.cant_minima), unidad: m.unidad || null, padre1: m.padre1 || null, div1: n(m.div1), padre2: m.padre2 || null, div2: n(m.div2), padre_corte: m.padre_corte || null, fila: m.fila ?? null })),
    sync: x?.sync || {},
  };
}
async function cargarMP(forzar) {
  const M = state.mp;
  if (M.cargando || (M.cargado && !forzar)) return;
  M.cargando = true; M.error = null;
  try {
    const [arbol, mapeo] = await Promise.all([rpcTodo("rot_mp_arbol", {}), rpcUno("rot_mp_mapeo")]);
    M.arbol = arbol.map((a) => ({ sku: a.sku, sku_norm: a.sku_norm, codigo: a.codigo, nivel: Number(a.nivel) || 1, factor: a.factor === null || a.factor === undefined ? null : Number(a.factor), via: a.via || a.codigo, sin_factor: a.sin_factor === true }));
    M.mapeo = normalizarMapeo(mapeo);
    M.materias = new Map(M.mapeo.materias.map((m) => [m.codigo, m]));
    M.prodPorNorm = new Map(M.mapeo.productos.map((p) => [MP.normSku(p.sku), p]));
    M.calc = null; M.cargado = true;
    if (M.excel.lectura) M.excel.diff = MP.diff(M.mapeo, M.excel.lectura);
  } catch (e) { M.error = e; registrarError("cargar materia prima", e); }
  finally { M.cargando = false; }
  if (state.tab === "mp") render();
}
async function cargarMensualMP(cod, silencioso) {
  const M = state.mp;
  if (M.mensual.has(cod) && !silencioso) return;
  if (!silencioso) M.mensual.set(cod, { cargando: true });
  try {
    const filas = await rpcTodo("rot_mp_mensual", { p_codigo: cod });
    M.mensual.set(cod, { filas: filas.map((f) => ({ mes: String(f.mes).slice(0, 7), sku: f.sku, unid: Number(f.unid) || 0, consumo: f.consumo === null ? null : Number(f.consumo), sin: f.sin_factor === true })) });

/* ---- cálculo: ranking por materia prima (cadena completa) + calidad de datos ---- */
function calcularMP() {
  const M = state.mp;
  if (M.calc && M.calc.cat === state.catalogo && M.calc.arbol === M.arbol) return M.calc;
  const hoy = dn(hoyAR());
  const catPorNorm = new Map();
  for (const c of state.catalogo) { const n = MP.normSku(c.sku_base); if (!catPorNorm.has(n)) catPorNorm.set(n, []); catPorNorm.get(n).push(c); }
  const agg = new Map(), porCodigo = new Map();
  for (const a of M.arbol) {
    let x = agg.get(a.codigo);
    if (!x) { x = { codigo: a.codigo, skus: new Set(), skusVenta: new Set(), u30: 0, u90: 0, u365: 0, c30: 0, c90: 0, c365: 0, sinF90: 0, ultima: null }; agg.set(a.codigo, x); porCodigo.set(a.codigo, []); }
    porCodigo.get(a.codigo).push(a);
    x.skus.add(a.sku_norm);
    for (const c of catPorNorm.get(a.sku_norm) || []) {
      if (c.unid_90 > 0) x.skusVenta.add(c.sku_base);
      x.u30 += c.unid_30; x.u90 += c.unid_90; x.u365 += c.unid_365;
      if (a.factor !== null) { x.c30 += c.unid_30 * a.factor; x.c90 += c.unid_90 * a.factor; x.c365 += c.unid_365 * a.factor; }
      else x.sinF90 += c.unid_90;
      if (c.ultima_venta && (!x.ultima || c.ultima_venta > x.ultima)) x.ultima = c.ultima_venta;
    }
  }
  const filas = [...agg.values()].map((x) => {
    const m = M.materias.get(x.codigo);
    const diasSin = x.ultima ? hoy - dn(x.ultima) : Infinity;
    const usaC = x.c90 > 0, b30 = usaC ? x.c30 : x.u30, b90 = usaC ? x.c90 : x.u90;
    const tend = b90 > 0 ? (b30 / 30) / (b90 / 90) - 1 : null;
    let estado = "activo";
    if (x.u90 === 0) estado = "inactivo";
    else if (diasSin >= UMBRALES.frenadoDias) estado = "frenado";
    else if (x.u90 >= UMBRALES.minUnid90 && tend !== null && tend <= UMBRALES.caida) estado = "caida";
    else if (x.u90 >= UMBRALES.minUnid90 && tend !== null && tend >= UMBRALES.alza) estado = "alza";
    const padres = m ? [m.padre1, m.padre2, !m.padre1 ? m.padre_corte : null].filter(Boolean) : [];
    return { ...x, nSkus: x.skus.size, nVenta: x.skusVenta.size, m, nombre: descMP(m, x.codigo), unidad: unidadMP(m), diasSin, v30: x.c30 / 30, tend, estado, padres, raiz: !padres.length };
  });
  // calidad de datos: SKUs vendidos en 90 d que no se pueden llevar a materia prima
  const directa = new Map();
  for (const a of M.arbol) if (a.nivel === 1) directa.set(a.sku_norm, a);
  let u90tot = 0, u90ok = 0;
  const sinMP = [];
  for (const c of state.catalogo) {
    if (!(c.unid_90 > 0)) continue;
    u90tot += c.unid_90;
    const n = MP.normSku(c.sku_base), p = M.prodPorNorm.get(n), a = directa.get(n);
    let motivo = null;
    if (!p) motivo = "No está en BASE GENERAL (o el SKU está escrito distinto que en la publicación)";
    else if (!p.codigo_mp) motivo = "Sin \"codigo mat prima\" en BASE GENERAL";
    else if (!M.materias.has(p.codigo_mp)) motivo = `La materia prima ${p.codigo_mp} no está en la hoja MATERIA PRIMA`;
    else if (!a || a.factor === null) motivo = "Sin factor: revisar Cant. Unidades Total, Division Cantidad del Padre o Cantidad del Padre";
    if (motivo) sinMP.push({ sku: c.sku_base, titulo: c.titulo || "", u90: c.unid_90, fila: p ? p.fila : null, motivo });
    else u90ok += c.unid_90;
  }
  sinMP.sort((a, b) => b.u90 - a.u90);
  M.calc = { cat: state.catalogo, arbol: M.arbol, filas, porCodigo, catPorNorm, sinMP, u90tot, u90ok, cobertura: u90tot ? u90ok / u90tot : null };
  return M.calc;
}

function agregarCapturas(files) {
  for (const f of files) {
    if (!/^image\//.test(f.type)) { tkUI.msg = { err: true, t: `"${f.name}" no es una imagen.` }; continue; }
    if (f.size > MAX_CAPTURA_MB * 1048576) { tkUI.msg = { err: true, t: `"${f.name || "captura"}" pesa más de ${MAX_CAPTURA_MB} MB.` }; continue; }
    if (tkUI.capturas.length >= MAX_CAPTURAS) { tkUI.msg = { err: true, t: `Máximo ${MAX_CAPTURAS} capturas.` }; break; }
    tkUI.capturas.push({ file: f, url: URL.createObjectURL(f) });
  }
  render();
}
async function enviarTicket() {
  const F = tkUI.form;
  if (F.asunto.trim().length < 3) { tkUI.msg = { err: true, t: "Poné un asunto (mínimo 3 letras)." }; render(); return; }
  tkUI.enviando = true; tkUI.msg = { t: "Enviando…" }; render();
  try {
    const { data: ses } = await sb.auth.getSession();
    const user = ses.session && ses.session.user;
    if (!user) throw new Error("La sesión venció: volvé a ingresar.");
    const capturas = [];
    for (let i = 0; i < tkUI.capturas.length; i++) {
      const f = tkUI.capturas[i].file;
      const ext = (f.type.split("/")[1] || "png").replace("jpeg", "jpg");
      const path = `${user.id}/${Date.now()}-${i}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
      const { error } = await sb.storage.from(TICKETS_BUCKET).upload(path, f, { contentType: f.type, upsert: false });
      if (error) throw new Error("No se pudo subir la captura: " + error.message);
      capturas.push({ bucket: TICKETS_BUCKET, path });
    }
    const { error } = await sb.from("tickets").insert({
      tipo: F.tipo, prioridad: F.prioridad, asunto: F.asunto.trim().slice(0, 200), detalle: F.detalle.trim().slice(0, 5000),
      estado: "pendiente", user_email: user.email, app_origen: APP.id,
      contexto: F.contexto ? contextoTecnico() : { app: APP.id, version: APP.version }, capturas,
    });
    if (error) throw error;
    tkUI.capturas.forEach((c) => URL.revokeObjectURL(c.url));
    Object.assign(tkUI, { capturas: [], form: { tipo: "error", prioridad: "media", asunto: "", detalle: "", contexto: true }, msg: { ok: true, t: "Ticket enviado. Lo ves abajo en la lista." } });
  } catch (e) {
    registrarError("ticket", e);
    tkUI.msg = { err: true, t: e.message || String(e) };
  }
  tkUI.enviando = false; render();
}

function initPicker() {
  const inp = $("#pickInput"), list = $("#pickList");
  const MAX_OPC = 60;
  let opts = [], act = 0, total = 0;
  const sinEsp = (x) => x.toLowerCase().replace(/\s+/g, "");
  const elegido = (k) => state.seleccion.includes(k);
  // tildar / destildar sin cerrar la lista ni borrar lo que escribiste
  const alternar = (k) => {
    if (elegido(k)) { state.seleccion.splice(state.seleccion.indexOf(k), 1); state.colorDe.delete(k); }
    else state.seleccion.push(k);
    render(); pintar();
  };
  const alternarTodos = () => {
    const todos = opts.every((o) => elegido(o.key));
    for (const o of opts) {
      if (todos && elegido(o.key)) { state.seleccion.splice(state.seleccion.indexOf(o.key), 1); state.colorDe.delete(o.key); }
      if (!todos && !elegido(o.key)) state.seleccion.push(o.key);
    }
    render(); pintar();
  };
  const pintar = (porTeclado = false) => {
    const scroll = list.scrollTop;
    list.textContent = "";
    if (!opts.length) { list.classList.toggle("hidden", !inp.value.trim()); if (inp.value.trim()) list.append(h("div", { class: "pick-head muted", text: "Sin coincidencias" })); return; }
    const nSel = opts.filter((o) => elegido(o.key)).length;
    const todos = nSel === opts.length;
    list.append(h("div", { class: "pick-head" },
      h("span", { class: "muted", text: `${total > opts.length ? `${opts.length} de ${nf0.format(total)}` : nf0.format(opts.length)} coincidencia${opts.length === 1 ? "" : "s"} · ${nSel} tildada${nSel === 1 ? "" : "s"}` }),
      opts.length > 1 ? h("button", { type: "button", class: "btn sm ghost", onmousedown: (e) => { e.preventDefault(); alternarTodos(); }, text: todos ? "Destildar todas" : "Tildar todas" }) : null,
      h("button", { type: "button", class: "btn sm", onmousedown: (e) => { e.preventDefault(); cerrar(); }, text: "Listo" })));
    opts.forEach((o, i) => {
      const chk = h("input", { type: "checkbox", tabindex: -1, "aria-hidden": "true" }); chk.checked = elegido(o.key);
      const b = h("button", { type: "button", class: "pick-opt" + (i === act ? " act" : "") + (chk.checked ? " on" : ""), role: "option", "aria-selected": String(chk.checked),
        onmousedown: (e) => { e.preventDefault(); act = i; alternar(o.key); } },
        chk, h("span", { class: "pk" }, h("span", { class: "sku", text: o.label }), o.nombre ? h("span", { class: "nm", text: o.nombre }) : null), h("span", { class: "muted", text: o.sub }));
      list.append(b);
    });
    list.classList.remove("hidden");
    list.scrollTop = scroll;
    if (porTeclado) { const a = list.querySelector(".pick-opt.act"); if (a) a.scrollIntoView({ block: "nearest" }); }
  };
  const buscar = () => {
    const q = inp.value.trim().toLowerCase(), qs = sinEsp(q);
    if (!q) { opts = []; total = 0; pintar(); return; }
    const exact = [], pref = [], cont = [];
    const op = (c) => ({ key: c.sku_base, label: c.sku_base, nombre: c.titulo || "", u: c.unid_90, sub: fN(c.unid_30) + " u/30d" });
    for (const c of state.catalogo) {
      const k = c.sku_base.toLowerCase();
      if (k === q || sinEsp(k) === qs) exact.push(op(c));
      else if (k.startsWith(q) || sinEsp(k).startsWith(qs)) pref.push(op(c));
      else if (k.includes(q) || sinEsp(k).includes(qs) || (c.titulo || "").toLowerCase().includes(q)) cont.push(op(c));
    }
    const byU = (a, b) => b.u - a.u;
    const todas = [...exact, ...pref.sort(byU), ...cont.sort(byU)];
    total = todas.length; opts = todas.slice(0, MAX_OPC); act = 0; list.scrollTop = 0; pintar();
  };
  const cerrar = () => { list.classList.add("hidden"); inp.value = ""; opts = []; inp.blur(); };
  inp.addEventListener("input", buscar);
  inp.addEventListener("focus", buscar);
  inp.addEventListener("blur", () => setTimeout(() => list.classList.add("hidden"), 150));
  inp.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { act = Math.min(opts.length - 1, act + 1); pintar(true); e.preventDefault(); }
    else if (e.key === "ArrowUp") { act = Math.max(0, act - 1); pintar(true); e.preventDefault(); }
    else if (e.key === "Enter" && opts[act]) { alternar(opts[act].key); e.preventDefault(); }
    else if (e.key === "Escape") { cerrar(); }
  });
}

    await cargarCatalogo();
    // 2) series diarias: solo lo que está en uso (selección + total); lo demás se pide de nuevo si se vuelve a mirar
    const enUso = () => new Set([...selEf().map(baseDe), TODOS]);
    const usar = enUso();
    const claves = [...state.cache.keys()].filter((k) => usar.has(k));
    const nuevas = claves.length ? await traerDiario(claves, desde) : new Map();
    const usarFin = enUso(); // la selección pudo cambiar mientras se traían los datos
    for (const k of [...state.cache.keys()]) if (!usarFin.has(k)) state.cache.delete(k);
    for (const [k, fresco] of nuevas) {
      const viejo = state.cache.get(k);
      if (viejo) state.cache.set(k, [...viejo.filter((f) => f.fecha < desde), ...fresco]);
    }
    // 3) materia prima abierta: su consumo mensual (incluye el mes en curso)
    const sel = state.mp.sel, prev = sel && state.mp.mensual.get(sel);
    state.mp.mensual.clear(); if (prev) state.mp.mensual.set(sel, prev);
    if (state.tab === "mp" && sel && prev && prev.filas) await cargarMensualMP(sel, true);
    if (largo) R.ultimoLargo = Date.now();
    R.ultimoOk = Date.now(); R.error = null;
  } catch (e) {
    R.error = e; registrarError("refresco automático", e);
  } finally { R.enCurso = false; pintarFrescura(); }
  if (R.error) return;
  R.pintarPendiente = true;
  if (manual || !usuarioOcupado()) await repintarSuave();
}
/** Repinta la pestaña actual con los datos nuevos, conservando scroll y foco. Datos y Tickets tienen formularios: no se repintan solos. */
async function repintarSuave() {
  const R = state.refresco;
  R.pintarPendiente = false;
  if (["datos", "tickets"].includes(state.tab) || $("#app").classList.contains("hidden")) return;
  const y = scrollY, foco = document.activeElement, lbl = foco && main().contains(foco) ? foco.getAttribute("aria-label") : null;
  const selIni = lbl ? foco.selectionStart : null, selFin = lbl ? foco.selectionEnd : null;
  R.auto = true;
  try { await render(); } finally { R.auto = false; }
  requestAnimationFrame(() => requestAnimationFrame(() => {
    scrollTo({ top: y });
    if (lbl) { const x = main().querySelector(`[aria-label="${CSS.escape(lbl)}"]`); if (x) { x.focus({ preventScroll: true }); try { x.setSelectionRange(selIni, selFin); } catch {} } }
  }));
}
let timerRefresco = null;
function iniciarRefresco() {
  if (timerRefresco) return;
  state.refresco.ultimoOk = state.refresco.ultimoOk || Date.now();
  state.refresco.ultimoLargo = state.refresco.ultimoLargo || Date.now(); // la carga inicial ya trajo toda la historia
  const vencido = () => Date.now() - state.refresco.ultimoOk >= REFRESCO.cadaSeg * 1000 && Date.now() - state.refresco.ultimoIntento >= REFRESCO.revisarCadaSeg * 1000;
  timerRefresco = setInterval(() => {
    if (vencido()) refrescar();
    else if (state.refresco.pintarPendiente && !state.refresco.enCurso && !document.hidden && !usuarioOcupado()) repintarSuave(); // terminó de escribir: mostrar lo que ya se trajo
  }, REFRESCO.revisarCadaSeg * 1000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && vencido()) refrescar(); });
  pintarFrescura();
}

/* ===================== Arranque ===================== */
async function entrar() {
  $("#login").classList.add("hidden");
  $("#app").classList.remove("hidden");
  main().replaceChildren(h("div", { class: "card empty" }, h("p", { text: "Cargando catálogo…" })));
  const { data: ok, error } = await sb.rpc("puede_ver_rotacion");
  if (error || !ok) {
    main().replaceChildren(vacio("Sin permiso", "Tu usuario no tiene acceso a Rotación. Pedile a gerencia que lo habilite (permiso ver_rotacion).", h("button", { class: "btn", onclick: salir, text: "Salir" })));
    return;
  }
  try { await cargarCatalogo(); }
  catch (e) { main().replaceChildren(vacio("No se pudo cargar el catálogo", e.message || String(e))); return; }
  sb.rpc("puede_importar_ventas").then(({ data }) => { state.puedeImportar = data === true; if (state.tab === "datos" || state.tab === "mp") render(); });
  Promise.all([sb.rpc("es_usuario_app"), sb.rpc("puede_gestionar_tickets")]).then(([a, g]) => {
    state.esUsuarioApp = a.data === true; state.puedeGestionar = g.data === true; if (state.tab === "tickets") render();
  });
  state.seleccion = state.seleccion.filter((k) => esBase(k) || state.presMap.has(codeOf(k)));
  render();
  iniciarRefresco();
}
function mostrarLogin() { $("#app").classList.add("hidden"); $("#login").classList.remove("hidden"); $("#lEmail").focus(); }
async function salir() { await sb.auth.signOut(); state.cache.clear(); Object.assign(state.mp, { cargado: false, arbol: [], mapeo: null, calc: null }); state.mp.mensual.clear(); mostrarLogin(); }

$("#loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = $("#lBtn"); btn.disabled = true; $("#lErr").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email: $("#lEmail").value.trim(), password: $("#lPass").value });
  btn.disabled = false;
  if (error) { $("#lErr").textContent = /invalid/i.test(error.message) ? "Email o contraseña incorrectos." : error.message; return; }
  entrar();
});
$("#btnLogout").addEventListener("click", salir);
$("#btnExport").addEventListener("click", () => (state.tab === "mp" && state.mp.sel ? exportarMP(state.mp.sel) : exportar()));
$("#btnAyuda").addEventListener("click", mostrarFuncionamiento);
$("#btnRefrescar").addEventListener("click", () => refrescar({ manual: true }));
$("#freshHelp").append(ayuda("Hora del último recálculo de la base que lee la app. Las ventas de Mercado Libre entran cada 5 min y las de Tienda Nube al instante (o cada 10 min); la base se recalcula cada 2 min. La pantalla se actualiza sola cada 2 min, sin recargar; si estás escribiendo o tenés una ventana abierta, espera a que termines. ↻ trae lo nuevo en el momento. Si aparece ⚠, no se pudo actualizar: los números son los de la hora indicada y reintenta solo."));
$("#versionTxt").textContent = "versión " + APP.version;
$("#btnClear").addEventListener("click", () => { state.seleccion = []; state.colorDe.clear(); render(); });
$("#tabs").addEventListener("click", (e) => { const b = e.target.closest("button[data-tab]"); if (b) irA(b.dataset.tab); });
$("#segPeriodo").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-p]"); if (!b) return;
  state.periodo = b.dataset.p;
  if (state.periodo === "custom") { const r = ultimo || {}; if (!state.desde) state.desde = r.desde || iso(dn(hoyAR()) - 90); if (!state.hasta) state.hasta = r.fin || hoyAR(); $("#fDesde").value = state.desde; $("#fHasta").value = state.hasta; }
  render();
});
$("#fDesde").addEventListener("change", (e) => { state.desde = e.target.value || null; render(); });
$("#fHasta").addEventListener("change", (e) => { state.hasta = e.target.value || null; render(); });
$("#fCanal").addEventListener("change", (e) => { state.canal = e.target.value; render(); });
$("#fEnvio").addEventListener("change", (e) => { state.envio = e.target.value; render(); });
$("#fMayorista").addEventListener("change", (e) => { state.mayorista = e.target.value; render(); });
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (state.tab === "mensual" || state.tab === "diario") render(); }, 200); });

initPicker();
leerHash();
if (state.periodo === "custom") { $("#fDesde").value = state.desde || ""; $("#fHasta").value = state.hasta || ""; }
sb.auth.getSession().then(({ data }) => (data.session ? entrar() : mostrarLogin()));
sb.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_OUT") mostrarLogin(); });
</script>
